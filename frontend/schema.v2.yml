components:
  schemas:
    AcknowledgeIn:
      additionalProperties: false
      description: "POST body for acknowledging a form: empty by design.\n\n``staff`` is always ``request.user``\
        \ \u2014 self-only by construction \u2014 so\nthe contract has no fields for a caller to fill\
        \ in. ``extra=\"forbid\"``\nstill gives the endpoint a real body schema: a client-supplied\n``{\"\
        staff\": ...}`` goes through the same RequestValidationError\nmachinery every other endpoint's\
        \ unexpected-key check does, rather than\na bespoke hand-rolled body guard."
      properties: {}
      title: AcknowledgeIn
      type: object
    AcknowledgementOut:
      description: One staff member's read receipt against a form (or, slice 2, a procedure).
      properties:
        acknowledged_at:
          format: date-time
          title: Acknowledged At
          type: string
        description:
          title: Description
          type: string
        id:
          format: uuid
          title: Id
          type: string
        staff:
          format: uuid
          title: Staff
          type: string
        staff_name:
          title: Staff Name
          type: string
      required:
      - id
      - staff
      - staff_name
      - acknowledged_at
      - description
      title: AcknowledgementOut
      type: object
    AddressCandidate:
      description: One structured candidate from the Google Address Validation API.
      properties:
        city:
          title: City
          type: string
        country:
          title: Country
          type: string
        formatted_address:
          title: Formatted Address
          type: string
        google_place_id:
          title: Google Place Id
          type: string
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
        postal_code:
          title: Postal Code
          type: string
        state:
          title: State
          type: string
        street:
          title: Street
          type: string
        suburb:
          title: Suburb
          type: string
      required:
      - formatted_address
      - street
      - suburb
      - city
      - state
      - postal_code
      - country
      - google_place_id
      - latitude
      - longitude
      title: AddressCandidate
      type: object
    AddressValidateRequest:
      description: Body for companies_addresses_validate_create.
      properties:
        address:
          title: Address
          type: string
      required:
      - address
      title: AddressValidateRequest
      type: object
    AddressValidateResponse:
      description: Response for companies_addresses_validate_create.
      properties:
        candidates:
          items:
            $ref: '#/components/schemas/AddressCandidate'
          title: Candidates
          type: array
      required:
      - candidates
      title: AddressValidateResponse
      type: object
    AdvancedSearchResponse:
      description: Wire contract for AdvancedSearchResponse.
      properties:
        jobs:
          items:
            $ref: '#/components/schemas/KanbanJobOut'
          title: Jobs
          type: array
        success:
          default: true
          title: Success
          type: boolean
        total:
          default: 0
          title: Total
          type: integer
      required:
      - jobs
      - success
      - total
      title: AdvancedSearchResponse
      type: object
    AllJobsResponse:
      description: Wire contract for AllJobsResponse.
      properties:
        jobs:
          items:
            $ref: '#/components/schemas/JobForPurchasing'
          title: Jobs
          type: array
        stock_holding_job_id:
          title: Stock Holding Job Id
          type: string
        success:
          title: Success
          type: boolean
      required:
      - success
      - jobs
      - stock_holding_job_id
      title: AllJobsResponse
      type: object
    AllocationDeleteRequest:
      description: Wire contract for AllocationDeleteRequest.
      properties:
        allocation_id:
          format: uuid
          title: Allocation Id
          type: string
        allocation_type:
          enum:
          - job
          - stock
          title: Allocation Type
          type: string
      required:
      - allocation_type
      - allocation_id
      title: AllocationDeleteRequest
      type: object
    AllocationDeleteResponse:
      description: Wire contract for AllocationDeleteResponse.
      properties:
        deleted_quantity:
          anyOf:
          - type: number
          - type: 'null'
          title: Deleted Quantity
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        job_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Name
        message:
          title: Message
          type: string
        success:
          title: Success
          type: boolean
        updated_received_quantity:
          anyOf:
          - type: number
          - type: 'null'
          title: Updated Received Quantity
      required:
      - deleted_quantity
      - description
      - job_name
      - message
      - success
      - updated_received_quantity
      title: AllocationDeleteResponse
      type: object
    AllocationDetailsResponse:
      description: Wire contract for AllocationDetailsResponse.
      properties:
        can_delete:
          title: Can Delete
          type: boolean
        consumed_by_jobs:
          anyOf:
          - type: integer
          - type: 'null'
          title: Consumed By Jobs
        description:
          title: Description
          type: string
        id:
          format: uuid
          title: Id
          type: string
        job_name:
          title: Job Name
          type: string
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        quantity:
          title: Quantity
          type: number
        type:
          enum:
          - stock
          - job
          title: Type
          type: string
        unit_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Unit Cost
        unit_revenue:
          anyOf:
          - type: number
          - type: 'null'
          title: Unit Revenue
      required:
      - can_delete
      - consumed_by_jobs
      - description
      - id
      - job_name
      - location
      - quantity
      - type
      - unit_cost
      - unit_revenue
      title: AllocationDetailsResponse
      type: object
    AllocationItem:
      description: Wire contract for AllocationItem.
      properties:
        allocation_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Allocation Date
        allocation_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Allocation Id
        alloy:
          anyOf:
          - type: string
          - type: 'null'
          title: Alloy
        description:
          title: Description
          type: string
        job_id:
          format: uuid
          title: Job Id
          type: string
        job_name:
          title: Job Name
          type: string
        metal_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Metal Type
        quantity:
          title: Quantity
          type: number
        retail_rate:
          default: 0
          title: Retail Rate
          type: number
        specifics:
          anyOf:
          - type: string
          - type: 'null'
          title: Specifics
        stock_location:
          anyOf:
          - type: string
          - type: 'null'
          title: Stock Location
        type:
          enum:
          - stock
          - job
          title: Type
          type: string
      required:
      - allocation_date
      - allocation_id
      - alloy
      - description
      - job_id
      - job_name
      - metal_type
      - quantity
      - retail_rate
      - specifics
      - stock_location
      - type
      title: AllocationItem
      type: object
    AssignJobRequest:
      description: Wire contract for AssignJobRequest.
      properties:
        staff_id:
          format: uuid
          title: Staff Id
          type: string
      required:
      - staff_id
      title: AssignJobRequest
      type: object
    AssignJobResponse:
      description: Wire contract for AssignJobResponse.
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        success:
          title: Success
          type: boolean
      required:
      - error
      - message
      - success
      title: AssignJobResponse
      type: object
    AuthErrorOut:
      description: Expected authentication refusal, distinct from domain-level 401s.
      properties:
        code:
          enum:
          - authentication_required
          - invalid_credentials
          title: Code
          type: string
        detail:
          title: Detail
          type: string
        error_id:
          title: Error Id
          type: 'null'
      required:
      - code
      - detail
      - error_id
      title: AuthErrorOut
      type: object
    BuildId:
      description: 'Response body for /api/build-id/: the deployed backend''s git SHA.'
      properties:
        build_id:
          title: Build Id
          type: string
      required:
      - build_id
      title: BuildId
      type: object
    CategoriesOut:
      description: The category pickers for forms/registers and procedures.
      properties:
        forms:
          items:
            $ref: '#/components/schemas/CategoryOut'
          title: Forms
          type: array
        procedures:
          items:
            $ref: '#/components/schemas/CategoryOut'
          title: Procedures
          type: array
      required:
      - forms
      - procedures
      title: CategoriesOut
      type: object
    CategoryOut:
      description: One selectable category (key/label pair) for a document picker.
      properties:
        key:
          title: Key
          type: string
        label:
          title: Label
          type: string
      required:
      - key
      - label
      title: CategoryOut
      type: object
    CompanyCreateRequest:
      description: Wire contract for CompanyCreateRequest.
      properties:
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        allow_jobs:
          default: true
          title: Allow Jobs
          type: boolean
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        is_account_customer:
          default: true
          title: Is Account Customer
          type: boolean
        name:
          title: Name
          type: string
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
      required:
      - name
      title: CompanyCreateRequest
      type: object
    CompanyCreateResponse:
      description: Wire contract for CompanyCreateResponse.
      properties:
        company:
          $ref: '#/components/schemas/CompanySearchResult'
        message:
          title: Message
          type: string
        success:
          title: Success
          type: boolean
      required:
      - success
      - company
      - message
      title: CompanyCreateResponse
      type: object
    CompanyDefaultsJobDetail:
      description: Wire contract for CompanyDefaultsJobDetail.
      properties:
        materials_markup:
          title: Materials Markup
          type: number
        time_markup:
          title: Time Markup
          type: number
        wage_rate:
          title: Wage Rate
          type: number
      required:
      - materials_markup
      - time_markup
      - wage_rate
      title: CompanyDefaultsJobDetail
      type: object
    CompanyDefaultsOut:
      description: 'Every stored default, plus the two derived logo URLs.


        Derived from the model rather than hand-listed. 67 fields transcribed by

        hand is 67 chances to disagree with the column, and the disagreement would

        only surface as a runtime validation failure in the SPA.


        The image fields themselves are excluded: they are write-only in the

        contract, and a client wants a URL it can put in an <img>, not a storage

        path it cannot resolve.'
      properties:
        accounting_provider:
          description: 'Active accounting integration: ''xero'' or ''myob'''
          maxLength: 20
          title: Accounting Provider
          type: string
        address_line1:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          description: Street address line 1
          title: Address Line1
        address_line2:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          description: Street address line 2 (optional)
          title: Address Line2
        annual_leave_loading:
          description: Percentage added to base_wage_rate to get costing wage_rate (20.00 = 20%)
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Annual Leave Loading
          type: string
        city:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: City
          title: City
        company_acronym:
          anyOf:
          - maxLength: 10
            type: string
          - type: 'null'
          description: Short acronym for the company (e.g., 'MSM' for Morris Sheetmetal)
          title: Company Acronym
        company_email:
          anyOf:
          - maxLength: 254
            type: string
          - type: 'null'
          description: Company contact email address
          title: Company Email
        company_name:
          maxLength: 255
          title: Company Name
          type: string
        company_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Company website URL
          title: Company Url
        country:
          description: Country name
          maxLength: 100
          title: Country
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        daily_approved_hours_target:
          description: Target daily hours of newly-approved work flowing into the shop, used by the Sales
            Pipeline scoreboard
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Daily approved hours target
          type: string
        enable_xero_sync:
          description: Gate for Xero sync. Defaults True (prod). Dev fixture sets False; seed_xero_from_database
            sets True after prod IDs are cleared.
          title: Enable Xero Sync
          type: boolean
        financial_year_start_month:
          description: Month the financial year starts (1=January, 4=April, 7=July, etc.)
          title: Financial Year Start Month
          type: integer
        fri_end:
          format: time
          title: Fri End
          type: string
        fri_start:
          format: time
          title: Fri Start
          type: string
        gdrive_how_we_work_folder_id:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Folder ID for '01 - How we work' (policies, basics)
          title: Gdrive How We Work Folder Id
        gdrive_quotes_folder_id:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Google Drive folder ID for storing quotes
          title: Gdrive Quotes Folder Id
        gdrive_quotes_folder_url:
          anyOf:
          - type: string
          - type: 'null'
          description: URL to the Google Drive folder for storing quotes
          title: Gdrive Quotes Folder Url
        gdrive_reference_library_folder_id:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Folder ID for '03 - Reference Library' (reference documents, forms, registers)
          title: Gdrive Reference Library Folder Id
        gdrive_sops_folder_id:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Folder ID for '02 - SOPs' (standard operating procedures)
          title: Gdrive Sops Folder Id
        google_shared_drive_id:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Google Shared Drive ID for the company shared drive
          title: Google Shared Drive Id
        gst_rate:
          description: Sales tax rate applied to amounts DocketWorks quotes before Xero has issued an
            invoice, as a fraction (0.1500 = 15% NZ GST). Xero remains authoritative for tax on invoices
            that exist.
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Gst Rate
          type: string
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: ID
        job_delta_soft_fail:
          description: When enabled, job delta checksum mismatches are logged and recorded without blocking
            the save. Disable to reject stale updates.
          title: Job Delta Soft Fail
          type: boolean
        kpi_daily_billable_hours_amber:
          description: Daily total billable hours across all staff above which the day is amber
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Daily billable hours (amber)
          type: string
        kpi_daily_billable_hours_green:
          description: Daily total billable hours across all staff above which the day is green
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Daily billable hours (green)
          type: string
        kpi_daily_gp_amber:
          description: Daily gross profit above which the day is amber
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Daily GP (amber)
          type: string
        kpi_daily_gp_green:
          description: Daily gross profit above which the day is green
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Daily GP (green)
          type: string
        kpi_daily_gp_target:
          description: Daily gross profit target in dollars
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Daily gross profit target
          type: string
        kpi_daily_shop_hours_percentage:
          description: Target percentage of daily hours spent on shop (non-billable) jobs
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Daily shop hours percentage target
          type: string
        kpi_job_gp_target_percentage:
          description: Target gross profit percentage for individual jobs
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Target GP % per job
          type: string
        last_xero_deep_sync:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: The last time a deep Xero sync was performed (looking back 90 days)
          title: Last Xero Deep Sync
        last_xero_sync:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: The last time Xero data was synchronized
          title: Last Xero Sync
        logo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Logo Url
        logo_wide_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Logo Wide Url
        master_quote_template_id:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Google Sheets ID for the quote template
          title: Master Quote Template Id
        master_quote_template_url:
          anyOf:
          - type: string
          - type: 'null'
          description: URL to the master Google Sheets quote template
          title: Master Quote Template Url
        materials_markup:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Materials Markup
          type: string
        mon_end:
          format: time
          title: Mon End
          type: string
        mon_start:
          format: time
          title: Mon Start
          type: string
        po_prefix:
          description: Prefix for purchase order numbers (e.g., PO-, JO-)
          maxLength: 10
          title: Po Prefix
          type: string
        post_code:
          anyOf:
          - maxLength: 20
            type: string
          - type: 'null'
          description: Postal/ZIP code
          title: Post Code
        shop_company:
          description: Internal company used for tracking shop work.
          format: uuid
          title: Shop Company
          type: string
        starting_job_number:
          description: Helper field to set the starting job number based on the latest paper job
          title: Starting Job Number
          type: integer
        starting_po_number:
          description: Helper field to set the starting purchase order number
          title: Starting Po Number
          type: integer
        suburb:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: Suburb (for NZ addresses)
          title: Suburb
        test_company_name:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          description: Name of the test company used for testing (e.g., 'ABC Carpet Cleaning TEST IGNORE').
            This company's name is preserved during data backports.
          title: Test Company Name
        thu_end:
          format: time
          title: Thu End
          type: string
        thu_start:
          format: time
          title: Thu Start
          type: string
        time_markup:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Time Markup
          type: string
        tue_end:
          format: time
          title: Tue End
          type: string
        tue_start:
          format: time
          title: Tue Start
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        wage_rate:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Wage Rate
          type: string
        wed_end:
          format: time
          title: Wed End
          type: string
        wed_start:
          format: time
          title: Wed Start
          type: string
        weekend_timesheets_enabled:
          description: Show Saturday and Sunday in timesheet views (7-day week). Off = 5-day Mon-Fri.
          title: Weekend Timesheets Enabled
          type: boolean
        workshop_efficiency_factor:
          description: Fraction of clocked workshop hours that count as schedulable productive output
            (e.g. 0.750 = 75%). Accounts for breaks, tool changes, idle time. Applied to per-day capacity
            in the workshop scheduler after subtracting booked time/leave.
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Workshop Efficiency Factor
          type: string
        xero_automated_day_floor:
          description: Reserve this many Xero daily API calls for user-initiated work. Automated sync
            aborts when the active Xero app reports remaining daily calls at or below this value.
          title: Xero Automated Day Floor
          type: integer
        xero_payroll_calendar_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Cached Xero Payroll calendar ID (set by xero --setup command)
          title: Xero Payroll Calendar Id
        xero_payroll_calendar_name:
          description: Name of Xero Payroll calendar to use (e.g., 'Weekly 2025')
          maxLength: 100
          title: Xero Payroll Calendar Name
          type: string
        xero_payroll_start_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: "Date Xero payroll went live \u2014 reconciliation ignores data before this"
          title: Xero Payroll Start Date
        xero_quote_terms:
          description: "Terms sent on every quote created by DocketWorks. Required \u2014 Xero does not\
            \ apply its own Terms (Quotes) default to quotes created through the API. Copy the same text\
            \ to Xero's Terms (Quotes) setting so quotes created directly in Xero during an outage use\
            \ the same terms."
          maxLength: 4000
          title: Xero quote terms
          type: string
        xero_sales_branding_theme_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Controls the layout and presentation of every quote and sales invoice created in
            Xero. It is configured during Xero setup and required before sales documents can be created.
          title: Xero sales branding theme
        xero_shortcode:
          anyOf:
          - maxLength: 20
            type: string
          - type: 'null'
          description: Xero organisation shortcode for deep linking (e.g., '!8-5Xl')
          title: Xero Shortcode
        xero_tenant_id:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          description: The Xero tenant ID to use for this company
          title: Xero Tenant Id
      required:
      - accounting_provider
      - address_line1
      - address_line2
      - annual_leave_loading
      - city
      - company_acronym
      - company_email
      - company_name
      - company_url
      - country
      - created_at
      - daily_approved_hours_target
      - enable_xero_sync
      - financial_year_start_month
      - fri_end
      - fri_start
      - gdrive_how_we_work_folder_id
      - gdrive_quotes_folder_id
      - gdrive_quotes_folder_url
      - gdrive_reference_library_folder_id
      - gdrive_sops_folder_id
      - google_shared_drive_id
      - gst_rate
      - id
      - job_delta_soft_fail
      - kpi_daily_billable_hours_amber
      - kpi_daily_billable_hours_green
      - kpi_daily_gp_amber
      - kpi_daily_gp_green
      - kpi_daily_gp_target
      - kpi_daily_shop_hours_percentage
      - kpi_job_gp_target_percentage
      - last_xero_deep_sync
      - last_xero_sync
      - logo_url
      - logo_wide_url
      - master_quote_template_id
      - master_quote_template_url
      - materials_markup
      - mon_end
      - mon_start
      - po_prefix
      - post_code
      - shop_company
      - starting_job_number
      - starting_po_number
      - suburb
      - test_company_name
      - thu_end
      - thu_start
      - time_markup
      - tue_end
      - tue_start
      - updated_at
      - wage_rate
      - wed_end
      - wed_start
      - weekend_timesheets_enabled
      - workshop_efficiency_factor
      - xero_automated_day_floor
      - xero_payroll_calendar_id
      - xero_payroll_calendar_name
      - xero_payroll_start_date
      - xero_quote_terms
      - xero_sales_branding_theme_id
      - xero_shortcode
      - xero_tenant_id
