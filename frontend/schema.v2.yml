          - type: 'null'
          title: Bill Rate Multiplier
        description:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Description
        end_time:
          anyOf:
          - format: time
            type: string
          - type: 'null'
          title: End Time
        hours:
          anyOf:
          - exclusiveMaximum: 100000.0
            minimum: 0.01
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          title: Hours
        is_billable:
          default: true
          title: Is Billable
          type: boolean
        job_id:
          format: uuid
          title: Job Id
          type: string
        start_time:
          anyOf:
          - format: time
            type: string
          - type: 'null'
          title: Start Time
        wage_rate_multiplier:
          anyOf:
          - exclusiveMaximum: 100.0
            minimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          default: '1.00'
          title: Wage Rate Multiplier
      required:
      - job_id
      - accounting_date
      - hours
      title: WorkshopTimesheetEntryRequest
      type: object
    WorkshopTimesheetEntryUpdateRequest:
      description: 'Partial workshop-entry update identified by ``entry_id``.


        Updates use the same storage and costing bounds as creation.'
      properties:
        accounting_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Accounting Date
        bill_rate_multiplier:
          anyOf:
          - exclusiveMaximum: 100.0
            minimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Bill Rate Multiplier
        description:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Description
        end_time:
          anyOf:
          - format: time
            type: string
          - type: 'null'
          title: End Time
        entry_id:
          format: uuid
          title: Entry Id
          type: string
        hours:
          anyOf:
          - exclusiveMaximum: 100000.0
            minimum: 0.01
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Hours
        is_billable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Billable
        job_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Job Id
        start_time:
          anyOf:
          - format: time
            type: string
          - type: 'null'
          title: Start Time
        wage_rate_multiplier:
          anyOf:
          - exclusiveMaximum: 100.0
            minimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Wage Rate Multiplier
      required:
      - entry_id
      title: WorkshopTimesheetEntryUpdateRequest
      type: object
    WorkshopTimesheetListResponse:
      description: Wire contract for WorkshopTimesheetListResponse.
      properties:
        date:
          format: date
          title: Date
          type: string
        entries:
          items:
            $ref: '#/components/schemas/WorkshopTimesheetEntryOut'
          title: Entries
          type: array
        summary:
          $ref: '#/components/schemas/WorkshopTimesheetSummaryOut'
      required:
      - date
      - entries
      - summary
      title: WorkshopTimesheetListResponse
      type: object
    WorkshopTimesheetSummaryOut:
      description: Wire contract for WorkshopTimesheetSummaryOut.
      properties:
        billable_hours:
          title: Billable Hours
          type: number
        non_billable_hours:
          title: Non Billable Hours
          type: number
        total_cost:
          title: Total Cost
          type: number
        total_hours:
          title: Total Hours
          type: number
        total_revenue:
          title: Total Revenue
          type: number
      required:
      - total_hours
      - billable_hours
      - non_billable_hours
      - total_cost
      - total_revenue
      title: WorkshopTimesheetSummaryOut
      type: object
    XeroInvoiceOut:
      description: Wire contract for XeroInvoiceOut.
      properties:
        number:
          title: Number
          type: string
        online_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Online Url
        status:
          title: Status
          type: string
      required:
      - number
      - status
      - online_url
      title: XeroInvoiceOut
      type: object
    XeroQuoteOut:
      description: Wire contract for XeroQuoteOut.
      properties:
        online_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Online Url
        status:
          title: Status
          type: string
      required:
      - status
      - online_url
      title: XeroQuoteOut
      type: object
  securitySchemes:
    CookieJWTAuth:
      in: cookie
      name: access_token
      type: apiKey
    OfficeStaffCookieJWTAuth:
      in: cookie
      name: access_token
      type: apiKey
    SuperuserCookieJWTAuth:
      in: cookie
      name: access_token
      type: apiKey
info:
  description: ''
  title: Docketworks API
  version: 2.0.0
openapi: 3.1.0
paths:
  /api/accounting/reports/calendar/:
    get:
      description: Return the month's aggregated daily KPIs (defaults to the current month).
      operationId: accounting_reports_calendar_retrieve
      parameters:
      - in: query
        name: year
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
      - in: query
        name: month
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Month
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPICalendarResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: KPI calendar data
      tags:
      - accounting
  /api/accounting/reports/job-aging/:
    get:
      description: Every job with financial totals, timing data, and last activity.
      operationId: accounting_reports_job_aging_retrieve
      parameters:
      - in: query
        name: include_archived
        required: false
        schema:
          default: false
          title: Include Archived
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAgingResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Job aging report
      tags:
      - accounting
  /api/accounting/reports/job-movement/:
    get:
      description: Job lifecycle and quote-conversion counts for management meetings.
      operationId: accounting_reports_job_movement_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      - in: query
        name: compare_start_date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Compare Start Date
      - in: query
        name: compare_end_date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Compare End Date
      - in: query
        name: baseline_days
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Baseline Days
      - in: query
        name: include_details
        required: false
        schema:
          default: false
          title: Include Details
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response
                type: object
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Job movement and conversion metrics
      tags:
      - accounting
  /api/accounting/reports/payroll-date-range/:
    get:
      description: Align arbitrary dates to payroll weeks (Monday..Sunday, window-floored).
      operationId: accounting_reports_payroll_date_range_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollDateRangeResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Pay-period-aligned week boundaries
      tags:
      - accounting
  /api/accounting/reports/payroll-reconciliation/:
    get:
      description: Reconcile Xero pay runs against JM time cost lines per week.
      operationId: accounting_reports_payroll_reconciliation_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollReconciliationResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: 'Weekly payroll reconciliation: Xero pay runs vs JM time'
      tags:
      - accounting
  /api/accounting/reports/profit-and-loss/:
    get:
      description: Return the explicit Phase 4 stub until Xero-backed P&L is rebuilt.
      operationId: accounting_reports_profit_and_loss_retrieve
      parameters: []
      responses:
        '501':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response
                type: object
          description: Not Implemented
      security:
      - CookieJWTAuth: []
      summary: Company profit and loss report
      tags:
      - accounting
  /api/accounting/reports/rdti-spend/:
    get:
      description: Actual spend grouped by job and R&D classification for the period.
      operationId: accounting_reports_rdti_spend_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RDTISpendResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: RDTI spend report
      tags:
      - accounting
  /api/accounting/reports/sales-forecast/:
    get:
      description: Compare monthly Xero invoice totals with JM revenue, newest first.
      operationId: sales_forecast_list
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesForecastResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Monthly sales forecast data
      tags:
      - accounting
  /api/accounting/reports/sales-forecast/{month}/:
    get:
      description: 'Drill into one month: matched, Xero-only, and JM-only rows.'
      operationId: sales_forecast_month_detail
      parameters:
      - in: path
        name: month
        required: true
        schema:
          title: Month
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesForecastMonthDetailResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Month detail for sales forecast
      tags:
      - accounting
  /api/accounting/reports/sales-pipeline/:
    get:
      description: Scoreboard, snapshot, velocity, funnel, and trend from JobEvent history.
      operationId: accounting_reports_sales_pipeline_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: End Date
      - in: query
        name: rolling_window_weeks
        required: false
        schema:
          default: 4
          title: Rolling Window Weeks
          type: integer
      - in: query
        name: trend_weeks
        required: false
        schema:
          default: 13
          title: Trend Weeks
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesPipelineResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Sales pipeline report
      tags:
      - accounting
  /api/accounting/reports/staff-performance-summary/:
    get:
      description: Billable utilisation and per-hour rates for every staff member.
      operationId: accounting_reports_staff_performance_summary_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPerformanceResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Staff performance summary (all staff)
      tags:
      - accounting
  /api/accounting/reports/staff-performance/{staff_id}/:
    get:
      description: One staff member's metrics with the per-job breakdown.
      operationId: accounting_reports_staff_performance_retrieve
      parameters:
      - in: path
        name: staff_id
        required: true
        schema:
          format: uuid
          title: Staff Id
          type: string
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPerformanceResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Staff performance detail (one staff member)
      tags:
      - accounting
  /api/accounting/reports/wip/:
    get:
      description: Uninvoiced WIP per job as at the given date (defaults to today).
      operationId: accounting_reports_wip_retrieve
      parameters:
      - in: query
        name: date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date
      - in: query
        name: method
        required: false
        schema:
          default: revenue
          enum:
          - revenue
          - cost
          title: Method
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WIPResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Work-in-progress report
      tags:
      - accounting
  /api/accounts/logout/:
    post:
      description: Clear both JWT cookies; logout never requires authentication.
      operationId: accounts_logout_create
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: OK
      summary: Logs out the current user by clearing JWT cookies
      tags:
      - accounts
  /api/accounts/me/:
    get:
      description: 'Return the authenticated user''s profile.


        The SPA''s session probe. CookieJWTAuth has already set request.user; no

        cookie or an invalid cookie yields the expected 401.'
      operationId: accounts_me_retrieve
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Returns the current authenticated user profile
      tags:
      - accounts
  /api/accounts/token/:
    post:
      description: 'Authenticate and set the JWT cookies.


        Authenticates username(=email)/password, sets access+refresh HttpOnly

        cookies, and returns an empty body (plus password_needs_reset when the

        user must change their password).'
      operationId: accounts_token_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: OK
      summary: Obtain JWT tokens as HttpOnly cookies (login)
      tags:
      - accounts
  /api/accounts/token/refresh/:
    post:
      description: 'Rotate the access-token cookie.


        Takes the refresh token from the body or the refresh cookie, rotates the

        access cookie, and returns an empty body. Refresh tokens are not rotated

        by design.'
      operationId: accounts_token_refresh_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/TokenRefreshRequest'
              - type: 'null'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: OK
      summary: Refresh the access-token cookie from the refresh token
      tags:
      - accounts
  /api/build-id/:
    get:
      description: Return the git SHA of the running backend process.
      operationId: build_id_retrieve
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildId'
          description: OK
      summary: Build Id Retrieve
      tags:
      - build-id
  /api/companies/addresses/validate/:
    post:
      description: 'Validate a freetext address and return structured candidates.


        503 when the Google API is unavailable or GOOGLE_MAPS_API_KEY is not

        configured (v1 behaviour).'
      operationId: companies_addresses_validate_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressValidateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressValidateResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Companies Addresses Validate Create
      tags:
      - companies
  /api/companies/all/:
    get:
      description: All companies (id + name only) for dropdowns and advanced search.
      operationId: companies_all_list
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CompanyNameOnly'
                title: Response
                type: array
          description: OK
      security:
      - CookieJWTAuth: []
      summary: List all companies
      tags:
      - Companies
  /api/companies/contact-methods/:
    get:
      description: List contact methods, filterable by owning company/person and type.
      operationId: companies_contact_methods_list
      parameters:
      - in: query
        name: company_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Company Id
      - in: query
        name: person_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Person Id
      - in: query
        name: method_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Method Type
      - in: query
        name: page
        required: false
        schema:
          default: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Size
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactMethodList'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Companies Contact Methods List
      tags:
      - companies
    post:
      description: Create a contact method for a company or person.
      operationId: companies_contact_methods_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMethodRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMethodOut'
          description: Created
      security:
      - CookieJWTAuth: []
      summary: Companies Contact Methods Create
      tags:
      - companies
  /api/companies/contact-methods/{id}/:
    delete:
      description: Delete one contact method.
      operationId: companies_contact_methods_destroy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          title: Id
          type: string
      responses:
        '204':
          description: No Content
      security:
      - CookieJWTAuth: []
      summary: Companies Contact Methods Destroy
      tags:
      - companies
    get:
      description: Retrieve one contact method.
      operationId: companies_contact_methods_retrieve
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          title: Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMethodOut'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Companies Contact Methods Retrieve
      tags:
      - companies
    patch:
      description: Partial update of one contact method.
      operationId: companies_contact_methods_partial_update
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          title: Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedContactMethodRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMethodOut'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Companies Contact Methods Partial Update
      tags:
      - companies
    put:
      description: Full update of one contact method.
      operationId: companies_contact_methods_update
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          title: Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMethodRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMethodOut'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Companies Contact Methods Update
      tags:
      - companies
  /api/companies/create/:
    post:
      description: "Create a company (v1: Xero first, then local sync).\n\nPhase 4 gap: raises NotImplementedError\
        \ (500) until the accounting\nprovider registry is ported \u2014 see CompanyRestService.create_company."
      operationId: companies_create_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyCreateResponse'
          description: Created
      security:
      - CookieJWTAuth: []
      summary: Create a new company
      tags:
      - Companies
  /api/companies/pickup-addresses/:
    get:
      description: List active pickup addresses, optionally filtered by supplier UUID.
      operationId: companies_pickup_addresses_list
      parameters:
      - in: query
        name: supplier_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Supplier Id
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SupplierPickupAddressOut'
                title: Response
                type: array
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Companies Pickup Addresses List
      tags:
      - companies
    post:
