    EntryOut:
      description: "One form entry \u2014 the entry list row and the entry detail alike.\n\n``display_data``\
        \ carries server-resolved labels for staff/entry_ref values\n(e.g. a staff UUID's display name,\
        \ a referenced entry's display_key value)\nso the client renders a row with no follow-up join.\
        \ It is a plain\ndeclared field, not a ``resolve_*`` staticmethod: computing it needs the\nform's\
        \ schema plus, for entry_ref fields, the referenced entry, which a\nsingle-hop ``resolve_*(obj)``\
        \ cannot reach, so the endpoint (Task 8) must\nset ``entry.display_data`` on the ORM instance\
        \ itself before\nserialisation.\n\nFable: a ``resolve_*`` fallback such as ``getattr(obj, \"display_data\"\
        ,\n{})`` was rejected \u2014 it would turn a missing enrichment pass into a\nsilent empty dict\
        \ instead of the loud ``AttributeError`` a plain field\nraises at serialisation time, and fail-early\
        \ treats \"the endpoint forgot\nto enrich this entry\" as a bug to surface, not a value to default\
        \ over."
