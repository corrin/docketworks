  /api/xero/disconnect/:
    post:
      description: 'Clear tokens on the active XeroApp.


        The row itself stays so the user can re-authorise without re-entering

        credentials. Inactive rows (e.g. a backup app) are untouched.'
      operationId: xero_disconnect_create
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroPingOut'
