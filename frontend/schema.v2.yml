  /api/timesheets/payroll/post-staff-week/:
    post:
      description: "Claim the calendar, dispatch the run, and return its opening document.\n\nOpus: A\
        \ run already in progress raises ``PayrollRunInProgressError``, a typed\nConflictError the envelope\
        \ answers 409 with \u2014 so a duplicate click is\nrefused here rather than handed a run id whose\
        \ only content is a fabricated\nfailure the client must open a stream to read.\n\nFable: The request\
        \ names only the week. The staff are the server's to\nderive and the postable-week rule is the\
        \ server's to enforce, on a mirror\nthis POST refreshes itself \u2014 the panel's read may be\
        \ an hour stale, and a\nstale banner must be able to cost at most a clear refusal, never a wrong\n\
        posting."
      operationId: timesheets_payroll_post_staff_week_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostWeekToXeroRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostWeekToXeroStartResponse'
          description: OK
      security:
      - SuperuserCookieJWTAuth: []
      summary: Start posting weekly timesheets to Xero Payroll
      tags:
      - timesheets
  /api/timesheets/payroll/runs/:
    get:
      description: "Return the current run document, which the stream also pushes.\n\nOpus: The polling\
        \ sibling of the SSE channel, and the reason the run document\nhas generated frontend types at\
        \ all \u2014 a stream cannot be a ninja operation\n(ADR 0047), so without this the wire contract\
        \ existed only as hand-written\nTypeScript. It is also what makes a reload rejoin a live run,\
        \ and what tells\nan expired run (404-shaped: an absent slot) apart from a lapsed session\n(401),\
        \ which the stream cannot express."
      operationId: timesheets_payroll_runs_retrieve
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollRunsOut'
          description: OK
      security:
      - SuperuserCookieJWTAuth: []
      summary: The payroll runs this organisation currently has state for
      tags:
      - timesheets
