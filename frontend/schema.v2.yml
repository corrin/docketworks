        \ maps to NOT NULL columns, so null is a 422 \u2014 the handler\nused to drop it silently, which\
        \ reported a refused edit as a success. The\n``NullableText`` block is the ADR 0040 set where\
        \ null is precisely how a\ncaller clears the value, and ``unit_revenue`` is nullable for the same\n\
        reason."
