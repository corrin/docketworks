      properties:
        line:
          $ref: '#/components/schemas/CostLineOut'
        message:
          title: Message
          type: string
        remaining_quantity:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Remaining Quantity
        success:
          title: Success
          type: boolean
      required:
