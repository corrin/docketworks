    PayrollPostRunOut:
      description: "The whole state of a payroll posting run.\n\nOpus: Latest-state-wins, the contract\
        \ ADR 0047 already proves with\ndata-versions: every push carries the complete current document,\
        \ so a client\nthat connects late, reconnects, or reloads needs no replay and no offset \u2014\
        \nit needs the present. The append-only event log this replaces existed to\nmake replay exact,\
        \ which is a problem this shape does not have.\n\n`updated_at` is the ordering guard. A catch-up\
        \ read can be in flight when a\npush lands, and the older answer would otherwise overwrite a finished\
        \ run\nwith a running one, leaving a panel spinning forever."
      properties:
        completed:
          title: Completed
          type: integer
        current_staff_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Staff Name
        failed:
          title: Failed
          type: integer
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        results:
          items:
            $ref: '#/components/schemas/StaffWeekPostResultOut'
          title: Results
          type: array
        run_id:
          format: uuid
          title: Run Id
          type: string
        status:
          $ref: '#/components/schemas/PayrollRunStatus'
        successful:
          title: Successful
          type: integer
        total:
          title: Total
          type: integer
        updated_at:
          format: date-time
          title: Updated At
          type: string
        week_start_date:
          format: date
          title: Week Start Date
          type: string
      required:
      - completed
      - current_staff_name
      - failed
      - message
      - results
      - run_id
      - status
      - successful
      - total
      - updated_at
      - week_start_date
      title: PayrollPostRunOut
      type: object
