      description: "Partial purchase-order update in which field presence is significant.\n\n``supplier_id``,\
        \ ``pickup_address_id``, ``reference`` and\n``expected_delivery`` are nullable because each can\
        \ be CLEARED \u2014 the\ncolumns are nullable and NULL is what unset means there. ``status`` cannot:\n\
        the column is NOT NULL, so a null is a 422 rather than something the\nhandler silently drops.\n\
        \nThe two list fields are presence-only. A null list means nothing an empty\nlist does not, and\
        \ reading them from ``model_fields_set`` rather than a\nnull check is what lets a caller send\
        \ ``lines: []``."
