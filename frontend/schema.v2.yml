      - client_id
      - created_at
      - day_remaining
      - has_tokens
      - id
      - is_active
      - label
      - last_429_at
      - minute_remaining
      - redirect_uri
      - snapshot_at
      - updated_at
      title: XeroAppOut
      type: object
    XeroAppPatchIn:
      description: 'PATCH payload: every field optional; secrets need not be re-supplied.'
      properties:
        client_id:
          minLength: 1
          title: Client Id
          type: string
        client_secret:
          minLength: 1
          title: Client Secret
          type: string
        label:
          minLength: 1
          title: Label
          type: string
        redirect_uri:
          minLength: 1
          title: Redirect Uri
          type: string
        webhook_key:
          minLength: 1
          title: Webhook Key
          type: string
      title: XeroAppPatchIn
      type: object
    XeroAuthRequiredOut:
      description: The Xero connection is missing or unusable; the client should re-auth.
      properties:
        message:
          title: Message
          type: string
        redirect_to_auth:
          title: Redirect To Auth
          type: boolean
        success:
          title: Success
          type: boolean
      required:
      - message
      - redirect_to_auth
      - success
      title: XeroAuthRequiredOut
      type: object
    XeroBrandingThemeOut:
      description: A selectable Xero document theme.
      properties:
        external_id:
          title: External Id
          type: string
        is_default:
          title: Is Default
          type: boolean
        name:
          title: Name
          type: string
      required:
      - external_id
      - is_default
      - name
      title: XeroBrandingThemeOut
      type: object
    XeroDocumentErrorResponse:
      description: A failed Xero document operation, with the reason.
      properties:
        error:
          title: Error
          type: string
        error_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Type
        messages:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Messages
        success:
          title: Success
          type: boolean
      required:
      - error
      - error_type
      - messages
      - success
      title: XeroDocumentErrorResponse
      type: object
    XeroDocumentSuccessResponse:
      description: 'A successful Xero document operation.


        The schema name is a contract: the E2E specs import it from the generated

        client. ``invoice_id``/``quote_id`` are the local rows; ``xero_id`` the

        Xero document.'
      properties:
        company:
          anyOf:
          - type: string
          - type: 'null'
          title: Company
        invoice_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Invoice Id
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        messages:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Messages
        online_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Online Url
        quote_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Quote Id
        success:
          title: Success
          type: boolean
        total_excl_tax:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Total Excl Tax
        total_incl_tax:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Total Incl Tax
        xero_id:
          title: Xero Id
          type: string
      required:
      - company
      - invoice_id
      - message
      - messages
      - online_url
      - quote_id
      - success
      - total_excl_tax
      - total_incl_tax
      - xero_id
      title: XeroDocumentSuccessResponse
      type: object
    XeroInvoiceCreateIn:
      description: 'How to derive the invoice amount for a job.


        ``percent`` is required for ``invoice_percent`` (percentage points, e.g.

        50 for half); ``amount`` (dollars) for ``invoice_amount``. Cross-field

        validation lives in ``calculate_invoice_amount``, which knows which modes

        each pricing methodology admits.'
      properties:
        amount:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Amount
        mode:
          enum:
          - invoice_full
          - invoice_costs_to_date
          - invoice_percent
          - invoice_amount
          title: Mode
          type: string
        percent:
          anyOf:
          - type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Percent
      required:
      - mode
      title: XeroInvoiceCreateIn
      type: object
    XeroInvoiceOut:
      description: Wire contract for XeroInvoiceOut.
      properties:
        number:
          title: Number
          type: string
        online_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Online Url
        status:
          title: Status
          type: string
      required:
      - number
      - status
      - online_url
      title: XeroInvoiceOut
      type: object
    XeroPayItemOut:
      description: "A Xero leave type or earnings rate.\n\n``multiplier`` is null for leave types and\
        \ set for earnings rates \u2014 that is\nthe discriminator the timesheet UI reads, alongside ``uses_leave_api``."
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        multiplier:
          anyOf:
          - type: number
          - type: 'null'
          title: Multiplier
        name:
          title: Name
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        uses_leave_api:
          title: Uses Leave Api
          type: boolean
        xero_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Xero Id
        xero_last_modified:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Xero Last Modified
        xero_last_synced:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Xero Last Synced
        xero_tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Xero Tenant Id
      required:
      - id
      - xero_id
      - xero_tenant_id
      - name
      - uses_leave_api
      - multiplier
      - xero_last_modified
      - xero_last_synced
      - created_at
      - updated_at
      title: XeroPayItemOut
      type: object
    XeroPingErrorOut:
      description: 'Ping failure: the liveness check itself blew up (e.g. refresh failed).'
      properties:
        connected:
          title: Connected
          type: boolean
        error:
          title: Error
          type: string
        error_id:
          title: Error Id
          type: string
      required:
      - connected
      - error
      - error_id
      title: XeroPingErrorOut
      type: object
    XeroPingOut:
      description: Connection status plus the two safety flags the E2E preflight reads.
      properties:
        connected:
          title: Connected
          type: boolean
        xero_production_client:
          title: Xero Production Client
          type: boolean
        xero_readonly:
          title: Xero Readonly
          type: boolean
      required:
      - connected
      - xero_production_client
      - xero_readonly
      title: XeroPingOut
      type: object
    XeroQuoteCreateIn:
      description: 'How to shape the quote''s Xero line items.


        ``breakdown`` sends one line per cost line; false sends a single line

        carrying the quote total (the dialog''s default).'
      properties:
        breakdown:
          title: Breakdown
          type: boolean
      required:
      - breakdown
      title: XeroQuoteCreateIn
      type: object
    XeroQuoteOut:
      description: Wire contract for XeroQuoteOut.
      properties:
        online_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Online Url
        status:
          title: Status
          type: string
      required:
      - status
      - online_url
      title: XeroQuoteOut
      type: object
    XeroSyncInfoOut:
      description: Last-sync times per entity plus whether a run is in flight.
      properties:
        last_syncs:
          additionalProperties:
            anyOf:
            - format: date-time
              type: string
            - type: 'null'
          title: Last Syncs
          type: object
        sync_in_progress:
          title: Sync In Progress
          type: boolean
        sync_range:
          title: Sync Range
          type: string
      required:
      - last_syncs
      - sync_in_progress
      - sync_range
      title: XeroSyncInfoOut
      type: object
    XeroSyncStartOut:
      description: A dispatched sync run.
      properties:
        message:
          title: Message
          type: string
        status:
          title: Status
          type: string
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
      required:
      - message
      - status
      - task_id
      title: XeroSyncStartOut
      type: object
  securitySchemes:
    CookieJWTAuth:
      in: cookie
      name: access_token
      type: apiKey
    OfficeStaffCookieJWTAuth:
      in: cookie
      name: access_token
      type: apiKey
    SuperuserCookieJWTAuth:
      in: cookie
      name: access_token
      type: apiKey
info:
  description: ''
  title: Docketworks API
  version: 2.0.0
openapi: 3.1.0
paths:
  /api/accounting/reports/calendar/:
    get:
      description: Return the month's aggregated daily KPIs (defaults to the current month).
      operationId: accounting_reports_calendar_retrieve
      parameters:
      - in: query
        name: year
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
      - in: query
        name: month
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Month
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPICalendarResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: KPI calendar data
      tags:
      - accounting
  /api/accounting/reports/job-aging/:
    get:
      description: Every job with financial totals, timing data, and last activity.
      operationId: accounting_reports_job_aging_retrieve
      parameters:
      - in: query
        name: include_archived
        required: false
        schema:
          default: false
          title: Include Archived
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAgingResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Job aging report
      tags:
      - accounting
  /api/accounting/reports/job-movement/:
    get:
      description: Job lifecycle and quote-conversion counts for management meetings.
      operationId: accounting_reports_job_movement_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      - in: query
        name: compare_start_date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Compare Start Date
      - in: query
        name: compare_end_date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Compare End Date
      - in: query
        name: baseline_days
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Baseline Days
      - in: query
        name: include_details
        required: false
        schema:
          default: false
          title: Include Details
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response
                type: object
          description: OK
      security:
      - OfficeStaffCookieJWTAuth: []
      summary: Job movement and conversion metrics
      tags:
      - accounting
  /api/accounting/reports/payroll-date-range/:
    get:
      description: Align arbitrary dates to payroll weeks (Monday..Sunday, window-floored).
      operationId: accounting_reports_payroll_date_range_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollDateRangeResponse'
          description: OK
      security:
      - SuperuserCookieJWTAuth: []
      summary: Pay-period-aligned week boundaries
      tags:
      - accounting
  /api/accounting/reports/payroll-reconciliation/:
    get:
      description: Reconcile Xero pay runs against JM time cost lines per week.
      operationId: accounting_reports_payroll_reconciliation_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollReconciliationResponse'
          description: OK
      security:
      - SuperuserCookieJWTAuth: []
      summary: 'Weekly payroll reconciliation: Xero pay runs vs JM time'
      tags:
      - accounting
  /api/accounting/reports/payroll-reconciliation/week/:
    get:
      description: 'Reconcile one week live, without waiting for the run to be Posted and synced.


        Its own endpoint rather than a parameter on the date-range report: that one

        reads the synced pay-slip mirror and answers a costing question over a

        window, while this reads the week''s run directly so it can answer in the

        minutes after posting, when a mistake is still cheap to fix.'
      operationId: accounting_reports_payroll_week_reconciliation_retrieve
      parameters:
      - in: query
        name: week_start_date
        required: true
        schema:
          format: date
          title: Week Start Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollWeekReconciliationResponse'
          description: OK
      security:
      - SuperuserCookieJWTAuth: []
      summary: 'One payroll week: what we expect Xero to pay, beside what Xero computed'
      tags:
      - accounting
  /api/accounting/reports/profit-and-loss/:
    get:
      description: Return the explicit Phase 4 stub until Xero-backed P&L is rebuilt.
      operationId: accounting_reports_profit_and_loss_retrieve
      parameters: []
      responses:
        '501':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response
                type: object
          description: Not Implemented
      security:
      - CookieJWTAuth: []
      summary: Company profit and loss report
      tags:
      - accounting
  /api/accounting/reports/rdti-spend/:
    get:
      description: Actual spend grouped by job and R&D classification for the period.
      operationId: accounting_reports_rdti_spend_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RDTISpendResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: RDTI spend report
      tags:
      - accounting
  /api/accounting/reports/sales-forecast/:
    get:
      description: Compare monthly Xero invoice totals with JM revenue, newest first.
      operationId: sales_forecast_list
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesForecastResponse'
          description: OK
      security:
      - OfficeStaffCookieJWTAuth: []
      summary: Monthly sales forecast data
      tags:
      - accounting
  /api/accounting/reports/sales-forecast/{month}/:
    get:
      description: 'Drill into one month: matched, Xero-only, and JM-only rows.'
      operationId: sales_forecast_month_detail
      parameters:
      - in: path
        name: month
        required: true
        schema:
          title: Month
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesForecastMonthDetailResponse'
          description: OK
      security:
      - OfficeStaffCookieJWTAuth: []
      summary: Month detail for sales forecast
      tags:
      - accounting
  /api/accounting/reports/sales-pipeline/:
    get:
      description: Scoreboard, snapshot, velocity, funnel, and trend from JobEvent history.
      operationId: accounting_reports_sales_pipeline_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: End Date
      - in: query
        name: rolling_window_weeks
        required: false
        schema:
          default: 4
          title: Rolling Window Weeks
          type: integer
      - in: query
        name: trend_weeks
        required: false
        schema:
          default: 13
          title: Trend Weeks
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesPipelineResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Sales pipeline report
      tags:
      - accounting
  /api/accounting/reports/staff-performance-summary/:
    get:
      description: Billable utilisation and per-hour rates for every staff member.
      operationId: accounting_reports_staff_performance_summary_retrieve
      parameters:
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPerformanceResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Staff performance summary (all staff)
      tags:
      - accounting
  /api/accounting/reports/staff-performance/{staff_id}/:
    get:
      description: One staff member's metrics with the per-job breakdown.
      operationId: accounting_reports_staff_performance_retrieve
      parameters:
      - in: path
        name: staff_id
        required: true
        schema:
          format: uuid
          title: Staff Id
          type: string
      - in: query
        name: start_date
        required: true
        schema:
          format: date
          title: Start Date
          type: string
      - in: query
        name: end_date
        required: true
        schema:
          format: date
          title: End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPerformanceResponse'
          description: OK
      security:
      - CookieJWTAuth: []
      summary: Staff performance detail (one staff member)
      tags:
      - accounting
  /api/accounting/reports/wip/:
    get:
      description: Uninvoiced WIP per job as at the given date (defaults to today).
      operationId: accounting_reports_wip_retrieve
      parameters:
      - in: query
        name: date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date
      - in: query
        name: method
        required: false
        schema:
          default: revenue
          enum:
          - revenue
          - cost
          title: Method
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WIPResponse'
          description: OK
      security:
      - OfficeStaffCookieJWTAuth: []
      summary: Work-in-progress report
      tags:
      - accounting
  /api/accounts/logout/:
    post:
      description: Clear both JWT cookies; logout never requires authentication.
      operationId: accounts_logout_create
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: OK
      summary: Logs out the current user by clearing JWT cookies
      tags:
      - accounts
  /api/accounts/me/:
    get:
      description: 'Return the authenticated user''s profile.


        The SPA''s session probe. CookieJWTAuth has already set request.user; no

        cookie or an invalid cookie yields the expected 401.'
      operationId: accounts_me_retrieve
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorOut'
          description: Unauthorized
      security:
      - CookieJWTAuth: []
      summary: Returns the current authenticated user profile
      tags:
      - accounts
  /api/accounts/me/password/:
    post:
      description: "Verify the current password, then validate and set the new one.\n\nThe one self-service\
        \ credential write. _set_staff_password also clears\npassword_needs_reset, which is what releases\
        \ a flagged session from the\nauth-layer password gate (apps/core/auth.py). Refusals are declared\
        \ 400\nbodies, not HttpErrors \u2014 the wire contract carries their shape, and an\nexpected refusal\
        \ writes no AppError row."
      operationId: accounts_me_password_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordErrorOut'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorOut'
          description: Unauthorized
      security:
      - CookieJWTAuth: []
      summary: Change the authenticated user's own password
      tags:
      - accounts
  /api/accounts/password-reset/:
    post:
      description: "Email a reset link to the address, if an active account holds it.\n\nFixed 200 either\
        \ way: the anonymous contract must not reveal which\naddresses have accounts (ADR 0038's public\
        \ contract). The send is\nQUEUED, not made in-request \u2014 a synchronous Gmail round trip runs\
        \ only\nfor addresses with accounts, which makes response latency (and a Gmail\noutage's 500)\
        \ an account-existence oracle; the enqueue costs the same\neither way. The match is the login\
        \ backend's own (sole_login_match), so\nanyone who can sign in can reset."
      operationId: accounts_password_reset_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
          description: OK
      summary: Request a password-reset email
      tags:
      - accounts
  /api/accounts/password-reset/confirm/:
    post:
      description: "Exchange a valid uid/token pair for a new password.\n\nThe token hashes the current\
        \ password (Django's generator), so a\nsuccessful reset burns the link. Refusals are declared\
        \ 400 bodies, not\nHttpErrors \u2014 see PasswordErrorOut."
      operationId: accounts_password_reset_confirm_create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
          description: OK
        '400':
          content:
            application/json:
