    WorkshopTimesheetEntryRequest:
      description: 'Workshop timesheet-entry creation payload.


        ``hours`` is at least 0.01 and below 100000; multipliers are non-negative

        and below 100. These bounds match storage precision and prevent negative

        cost and revenue from entering the actual CostSet.'
      properties:
        accounting_date:
          format: date
          title: Accounting Date
          type: string
        bill_rate_multiplier:
          anyOf:
          - exclusiveMaximum: 100.0
            minimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Bill Rate Multiplier
        description:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Description
        end_time:
          anyOf:
          - format: time
            type: string
          - type: 'null'
          title: End Time
        hours:
          anyOf:
          - exclusiveMaximum: 100000.0
            minimum: 0.01
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          title: Hours
        is_billable:
          default: true
          title: Is Billable
          type: boolean
        job_id:
          format: uuid
          title: Job Id
          type: string
        start_time:
          anyOf:
          - format: time
            type: string
          - type: 'null'
          title: Start Time
        wage_rate_multiplier:
          anyOf:
          - exclusiveMaximum: 100.0
            minimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          default: '1.00'
          title: Wage Rate Multiplier
      required:
      - job_id
      - accounting_date
      - hours
      title: WorkshopTimesheetEntryRequest
      type: object
