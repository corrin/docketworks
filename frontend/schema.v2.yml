          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroDocumentSuccessResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroDocumentErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroAuthRequiredOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroDocumentErrorResponse'
