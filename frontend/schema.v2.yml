  /api/xero/pay-items/:
    get:
      description: 'Every pay item, ordered leave-types-last then by name.


        A bare array rather than a paginated envelope: the table is a handful of

        rows a store loads once, and v1''s client is typed for an array.'
      operationId: xero_pay_items_list
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/XeroPayItemOut'
                title: Response
                type: array
          description: OK
      security:
      - CookieJWTAuth: []
      summary: List Xero pay items (earnings rates and leave types)
      tags:
      - xero
  /api/xero/ping/:
    get:
      description: "Liveness check: ``connected`` means get_valid_token() produced a token.\n\nNot inert\
        \ \u2014 a near-expiry token triggers a real refresh. A refresh that\nreaches Xero and fails is\
        \ a 500 with an ``error_id``, never a quiet\n``connected: false``: the E2E preflight and the header\
        \ badge must not\nmistake an operational failure for a clean not-connected install."
      operationId: xero_ping_retrieve
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroPingOut'
          description: OK
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroPingErrorOut'
          description: Internal Server Error
      security:
      - CookieJWTAuth: []
      summary: Check the Xero connection
      tags:
      - xero
  /api/xero/sync-info/:
    get:
      description: "Last-sync times for every entity and the in-progress flag.\n\nA pure read of local\
        \ tables and the shared-cache lock. v1 gated this on\nget_valid_token(), which can perform a token\
        \ refresh \u2014 a write on a GET\nfor a payload that needs no token at all."
      operationId: xero_sync_info_retrieve
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroSyncInfoOut'
          description: OK
      security:
      - OfficeStaffCookieJWTAuth: []
      summary: Xero sync status and last-sync times
      tags:
      - xero
  /api/xero/sync/:
    post:
      description: "Dispatch a background sync run.\n\n409 when a run already holds the lock (v1 said\
        \ 200 \"already running\";\nthe explicit status lets a client distinguish without parsing prose\
        \ \u2014\nthe body still carries the active task id either way)."
      operationId: xero_sync_create
      parameters: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroSyncStartOut'
          description: Accepted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroAuthRequiredOut'
          description: Unauthorized
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroSyncStartOut'
          description: Conflict
      security:
      - OfficeStaffCookieJWTAuth: []
      summary: Start a Xero sync
      tags:
      - xero
