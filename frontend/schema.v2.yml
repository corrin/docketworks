      description: Delete an inactive row; the active row is protected.
      operationId: xero_apps_destroy
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          format: uuid
          title: App Id
          type: string
      responses:
        '204':
          description: No Content
        '400':
          content:
            application/json:
              schema:
