      description: "Apply the supplied fields; a credential change invalidates tokens.\n\nA new client_id\
        \ (or secret) is a different Xero app from Xero's\nperspective \u2014 the old tokens and quota\
        \ state are wiped, and if the row is\nactive the in-process ApiClient singleton resets and sibling\
        \ workers\nrestart, exactly as an activation swap would."
      operationId: xero_apps_partial_update
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          format: uuid
          title: App Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XeroAppPatchIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroAppOut'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroAppErrorOut'
          description: Bad Request
      security:
      - OfficeStaffCookieJWTAuth: []
      summary: Update a Xero app credential pair
      tags:
      - xero
  /api/xero/apps/{app_id}/activate/:
    post:
      description: "Swap the active row; workers restart to rebuild their clients.\n\nswap_active dispatches\
        \ a detached ``systemctl restart`` for the worker\nunits \u2014 gunicorn (this process) included.\
        \ The HTTP response gets out\nbefore systemd kills us; the operator's next request lands on a\
        \ fresh\nworker bound to the new active row."
      operationId: xero_apps_activate
      parameters:
      - in: path
        name: app_id
        required: true
        schema:
          format: uuid
          title: App Id
          type: string
      responses:
