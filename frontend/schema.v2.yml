          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XeroAppActivateOut'
          description: OK
      security:
      - OfficeStaffCookieJWTAuth: []
      summary: Make this Xero app the active credential pair
      tags:
      - xero
