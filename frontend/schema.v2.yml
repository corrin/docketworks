      description: "Push the job's quote cost set to Xero and persist the local mirror.\n\nNo trailing\
        \ slash: v1's URL, kept so the E2E spec's request matcher\nports unedited. Unexpected exceptions\
        \ are persisted and raised \u2014 the\nstandard error envelope carries them (ADR 0038)."
      operationId: xero_create_quote
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          format: uuid
          title: Job Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XeroQuoteCreateIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
