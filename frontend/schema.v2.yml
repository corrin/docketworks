      summary: Create a Xero quote for a job
      tags:
      - xero
  /api/xero/delete_invoice/{job_id}:
    delete:
      description: 'Void the invoice in Xero and drop the local mirror row.


        ``xero_invoice_id`` is a required query parameter (v1 contract): a job can

        carry several invoices, so deletion is always pinned to one.'
      operationId: xero_delete_invoice
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          format: uuid
          title: Job Id
          type: string
      - in: query
        name: xero_invoice_id
        required: true
        schema:
          format: uuid
          title: Xero Invoice Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
