# Only the workflows' own actions. Frontend and Python dependencies move through the weekly
# sweep (.github/workflows/dependency-sweep.yml, ADR 0033): one PR with everything at latest,
# tested as the combination that ships. Dependabot's per-package PRs never test that
# combination, never see a transitive package, and never propose a Python version the declared
# range already admits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
