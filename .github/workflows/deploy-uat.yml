name: Deploy to UAT
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  pull-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest on UAT server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          # Updates only the shared repo mirror at /opt/docketworks/repo
          # (docs/server_setup.md Part F). Instances are untouched; an operator
          # runs scripts/server/deploy.sh to release. reset --hard, not pull:
          # the mirror is never committed to locally, and reset survives a
          # force-pushed main where --ff-only would wedge.
          script: |
            git -C /opt/docketworks/repo fetch origin
            git -C /opt/docketworks/repo reset --hard origin/main
