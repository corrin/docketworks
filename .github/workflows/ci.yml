name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docketworks_v2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy (strict, zero baseline)
        run: uv run mypy
      - name: import-linter (layer contract)
        run: uv run lint-imports
      - name: deptry (dependency hygiene)
        run: uv run deptry .
      - name: find-duplicates (one concept, one implementation)
        # Also a pre-commit hook, and needs to be both: hooks are per-clone, so
        # a contributor who has not installed them (or who passes --no-verify)
        # would otherwise merge duplication with a green PR. Every other Python
        # gate here is likewise doubled.
        run: uv run python scripts/find_duplicates.py
      - name: delta goldens are current
        run: |
          uv run python scripts/gen_delta_goldens.py
          git diff --exit-code tests/delta-checksum-goldens.json
      - name: pytest
        run: uv run pytest
      - name: API schema parity (v1 contract)
        run: uv run python scripts/schema_parity_diff.py
      - name: exported schema is current
        # The frontend generates its typed client from frontend/schema.v2.yml.
        # Without this, a backend change silently leaves the client describing
        # an API that no longer exists — and the frontend job's "generated
        # client is current" check would still pass, because it only compares
        # the client against that stale input.
        run: uv run python scripts/export_openapi.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: generated client is current
        run: |
          npm run gen:api
          git diff --exit-code src/api/generated
      - name: oxlint
        run: npm run lint
      - name: prettier check
        run: npm run format:check
      - name: dependency audit (high+)
        run: npm audit --audit-level=high
      - name: API boundary check
        run: npm run check:boundary
      - name: unit tests (incl. checksum goldens)
        run: npm run test:unit
      - name: type-check and build
        run: npm run build
