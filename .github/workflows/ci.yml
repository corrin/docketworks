name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-django-secret-key-at-least-32-bytes
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-at-least-32-bytes
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docketworks_v2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy (strict, zero baseline)
        run: uv run mypy
      - name: import-linter (layer contract)
        run: uv run lint-imports
      - name: deptry (dependency hygiene)
        run: uv run deptry .
      - name: find-duplicates (one concept, one implementation)
        # Also a pre-commit hook, and needs to be both: hooks are per-clone, so
        # a contributor who has not installed them (or who passes --no-verify)
        # would otherwise merge duplication with a green PR. Every other Python
        # gate here is likewise doubled.
        run: uv run python -m scripts.checks.find_duplicates
      - name: check-naive-local-dates (timezone.now().date() is the UTC date)
        run: uv run python -m scripts.checks.check_naive_local_dates
      - name: server suite (shellcheck, templates, fail2ban filters)
        run: bash scripts/server/test_server_templates.sh
      - name: server release-utils tests
        run: bash scripts/test_release_utils.sh
      - name: delta goldens are current
        run: |
          uv run python -m scripts.generate.gen_delta_goldens
          git diff --exit-code tests/delta-checksum-goldens.json
      - name: pytest
        # Coverage lives here rather than in pyproject's addopts so local runs
        # stay fast; the fail_under ratchet only has to hold on this run.
        # -n auto distributes across the runner's cores; pytest-django gives
        # each worker its own test database.
        run: uv run pytest -n auto --cov=apps --cov=config --cov-report=term-missing:skip-covered
      - name: exported schema is current
        # The frontend generates its typed client from frontend/schema.v2.yml.
        # Without this, a backend change silently leaves the client describing
        # an API that no longer exists — and the frontend job's "generated
        # client is current" check would still pass, because it only compares
        # the client against that stale input.
        run: uv run python -m scripts.checks.export_openapi --check
      - name: status table matches the repo
        # Here rather than pre-commit: it boots Django and collects the suite,
        # ~10s that the dev loop should not pay on every commit. The table
        # drifted in two consecutive PRs and review caught it both times,
        # which is the wrong place to catch arithmetic.
        run: uv run python -m scripts.checks.status_table --check
      - name: code quality metrics are current
        # docs/code-quality.md is committed so a change that adds suppressions or
        # shim-shaped handlers has to show that movement in its own diff. CI runs
        # it because a pre-push hook can be skipped with --no-verify.
        run: uv run python -m scripts.checks.code_quality --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: generated client is current
        run: |
          npm run gen:api
          git diff --exit-code src/api/generated
      - name: oxlint
        run: npm run lint
      - name: prettier check
        run: npm run format:check
      - name: dependency audit (high+)
        run: npm audit --audit-level=high
      - name: API boundary check
        run: npm run check:boundary
      - name: unit tests and coverage ratchet (incl. checksum goldens)
        run: npm run test:coverage
      - name: type-check and build
        run: npm run build
