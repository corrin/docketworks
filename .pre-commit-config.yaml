# Two tiers, split on one measured fact: booting Django costs ~6s, and
# everything that does not touch it totals ~1.5s.
#
#   cheap     stages: [pre-commit]  automatic, ~2.4s
#   expensive stages: [pre-push]    automatic on push, ~23s
#
# Neither is the actual gate — a local hook can be skipped with --no-verify or
# never installed. CI runs every hook in both tiers and that is what gates. The
# tiers exist so the commit loop stops paying for checks that need not run that
# often, and moving a hook between them is a one-word edit.
#
#   pre-commit run --all-files                        # cheap
#   pre-commit run --all-files --hook-stage pre-push  # expensive
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, zero baseline)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (layer contract)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      # --- expensive tier: every hook below boots Django (~6s each) ---
      - id: migrations-check
        name: makemigrations --check
        entry: uv run python manage.py makemigrations --check --dry-run --settings=config.settings_test
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      # Regenerating fixers, not checks: each writes the generated artifact,
      # and pre-commit fails the hook when files changed — the refreshed file
      # is already in the working tree, so the fix is `git add` and re-push,
      # never "remember the regeneration command". CI still runs the --check
      # form of each; that is the gate. The coverage row of the status table
      # stays untouched here (it needs a full suite run for fresh input; the
      # generator keeps the committed value when no measurement exists).
      - id: schema-current
        name: exported schema (regenerates on drift)
        entry: uv run python -m scripts.checks.export_openapi
        language: system
        types: [python]
        pass_filenames: false
      - id: delta-goldens
        name: delta goldens (regenerates on drift)
        entry: uv run python -m scripts.generate.gen_delta_goldens
        language: system
        types: [python]
        pass_filenames: false
      - id: status-table
        name: status table (regenerates on drift)
        entry: uv run python -m scripts.checks.status_table
        language: system
        # Fable: triggered by the table's inputs, not by Python files: it counts
        # E2E specs and exposed operations too, so a frontend-only commit moved
        # it while a types: [python] hook slept and CI's --check went red. Not
        # always_run either — it boots Django and collects the suite (~10s),
        # which a docs-only commit should not pay.
        files: ^(apps/.*\.py|frontend/tests/e2e/.*\.spec\.ts|frontend/schema\.v2\.yml|docs/adr/.*\.md|docs/accepted-api-differences\.yml|scripts/v1-frontend-operations\.yml|docs/rewrite-status\.md|pyproject\.toml)$
        pass_filenames: false
      - id: code-quality
        name: code quality metrics (regenerates on drift)
        entry: uv run python -m scripts.checks.code_quality
        language: system
        types: [python]
        pass_filenames: false
      - id: find-duplicates
        name: find-duplicates (one concept, one implementation)
        entry: uv run python -m scripts.checks.find_duplicates
        language: system
        types: [python]
        pass_filenames: false
      - id: check-naive-local-dates
        name: check-naive-local-dates (timezone.now().date() is the UTC date)
        entry: uv run python -m scripts.checks.check_naive_local_dates
        language: system
        types: [python]
        pass_filenames: false
      - id: check-disposition-paths
        name: check-disposition-paths (every "ported" path in v1-disposition.md exists)
        entry: uv run python -m scripts.checks.check_disposition_paths
        language: system
        # Deliberately unfiltered. Scoping it to the document would miss the
        # likelier staleness: a rename ANYWHERE in the tree it describes. At
        # 0.2s (no Django) the whole-tree run costs less than the filter saves.
        always_run: true
        pass_filenames: false
      - id: deptry
        name: deptry (dependency hygiene)
        entry: uv run deptry .
        language: system
        files: ^(pyproject\.toml|uv\.lock|apps/|config/)
        pass_filenames: false
      - id: frontend-lint
        name: oxlint (frontend)
        entry: bash -c 'cd frontend && npm run --silent lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|mjs)$
        pass_filenames: false
      - id: frontend-format
        name: prettier (frontend, rewrites on drift)
        entry: bash -c 'cd frontend && npm run --silent format'
        language: system
        files: ^frontend/.*\.(ts|tsx|mjs|css|json)$
        pass_filenames: false
      - id: frontend-client-current
        name: generated API client (regenerates on drift)
        entry: bash -c 'cd frontend && npm run --silent gen:api'
        language: system
        pass_filenames: false
        always_run: true
      - id: frontend-type-check
        name: tsc (frontend)
        entry: bash -c 'cd frontend && npm run --silent type-check'
        language: system
        pass_filenames: false
        always_run: true
      - id: frontend-audit
        name: npm audit (high and above)
        entry: bash -c 'cd frontend && npm audit --audit-level=high'
        language: system
        pass_filenames: false
        always_run: true
      - id: frontend-boundary
        name: API boundary check (frontend)
        entry: bash -c 'cd frontend && npm run --silent check:boundary'
        language: system
        files: ^frontend/src/
        pass_filenames: false
      - id: server-shell-checks
        name: server suite (shellcheck, templates, fail2ban filters)
        entry: bash scripts/server/test_server_templates.sh
        language: system
        files: ^(scripts/|\.env\.example)
        pass_filenames: false
      - id: server-release-utils-tests
        name: server release-utils tests
        entry: bash scripts/test_release_utils.sh
        language: system
        files: ^scripts/
        pass_filenames: false
