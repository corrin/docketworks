repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, zero baseline)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (layer contract)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: migrations-check
        name: makemigrations --check
        entry: uv run python manage.py makemigrations --check --dry-run --settings=config.settings_test
        language: system
        types: [python]
        pass_filenames: false
      - id: find-duplicates
        name: find-duplicates (one concept, one implementation)
        entry: uv run python scripts/find_duplicates.py
        language: system
        types: [python]
        pass_filenames: false
      - id: deptry
        name: deptry (dependency hygiene)
        entry: uv run deptry .
        language: system
        files: ^(pyproject\.toml|uv\.lock|apps/|config/)
        pass_filenames: false
      - id: frontend-lint
        name: oxlint (frontend)
        entry: bash -c 'cd frontend && npm run --silent lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|mjs)$
        pass_filenames: false
      - id: frontend-format
        name: prettier --check (frontend)
        entry: bash -c 'cd frontend && npm run --silent format:check'
        language: system
        files: ^frontend/.*\.(ts|tsx|mjs|css|json)$
        pass_filenames: false
      - id: frontend-boundary
        name: API boundary check (frontend)
        entry: bash -c 'cd frontend && npm run --silent check:boundary'
        language: system
        files: ^frontend/src/
        pass_filenames: false
