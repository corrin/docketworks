repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, zero baseline)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (layer contract)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: migrations-check
        name: makemigrations --check
        entry: uv run python manage.py makemigrations --check --dry-run --settings=config.settings_test
        language: system
        types: [python]
        pass_filenames: false
