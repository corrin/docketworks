# Fail2ban filter: failed logins against the token endpoint.
# Matches the docketworks_timed_combined nginx access-log format and ONLY
# a 401 on exactly POST /api/accounts/token/ — successful logins,
# other endpoints, and nginx's own 429 rate-limit responses never match.
# Installed by server-setup.sh as filter.d/docketworks-auth-login.conf.

# The optional (\?[^" ]*)? matters: Django routes on the path alone, so a
# 401 comes back with any query string attached — without it, appending
# ?x=1 to every request would evade the ban forever.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "POST /api/accounts/token/(\?[^" ]*)? HTTP/[^"]*" 401\s
ignoreregex =
