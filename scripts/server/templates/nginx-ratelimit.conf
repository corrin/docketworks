# Per-IP rate-limit zones for the authentication endpoints. Installed to
# /etc/nginx/conf.d/docketworks-ratelimit.conf by server-setup.sh; the
# limit_req consumers are in each instance's server block
# (nginx-instance.conf.template). Requests over the limit get HTTP 429,
# which the fail2ban auth filters deliberately do not count — only real
# 401s from the app mark an attacker.
# Loopback is unlimited: verify-instance.sh --e2e drives the suite from the
# box itself and logs in once per test (ADR 0064); an empty key is nginx's
# "do not count this request".
map $remote_addr $dw_limit_key {
    default   $binary_remote_addr;
    127.0.0.1 "";
}
limit_req_zone $dw_limit_key zone=dw_login:10m rate=10r/m;
limit_req_zone $dw_limit_key zone=dw_refresh:10m rate=60r/m;
limit_req_status 429;
