# Fail2ban filter: failed refreshes against the token-refresh endpoint.
# Matches the docketworks_timed_combined nginx access-log format and ONLY
# a 401 on exactly POST /api/accounts/token/refresh/. Expired sessions
# legitimately 401 here (every open tab does, after a signing-key
# rotation), which is why the jail threshold is much looser than login's.
# Installed by server-setup.sh as filter.d/docketworks-auth-refresh.conf.

# The optional (\?[^" ]*)? matters: Django routes on the path alone, so a
# 401 comes back with any query string attached — without it, appending
# ?x=1 to every request would evade the ban forever.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "POST /api/accounts/token/refresh/(\?[^" ]*)? HTTP/[^"]*" 401\s
ignoreregex =
