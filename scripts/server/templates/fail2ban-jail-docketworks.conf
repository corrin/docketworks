# Fail2ban jails for docketworks hosts. Installed by server-setup.sh as
# jail.d/docketworks.local (jail.d entries override jail.conf defaults).
#
# All bans act through UFW so there is exactly one firewall owner.
# The sshd jail uses the systemd journal backend: Ubuntu 24.04 has no
# /var/log/auth.log unless rsyslog is installed.
#
# The auth jails read every instance's nginx access log — one host runs
# many instances (the UAT box) and an attacker probing any of them earns
# a host-wide ban. instance.sh reloads fail2ban after creating a new
# instance so the glob picks up the new log file.

[DEFAULT]
banaction = ufw

[sshd]
enabled = true
backend = systemd
maxretry = 5
findtime = 10m
bantime = 1h

[docketworks-auth-login]
enabled = true
filter = docketworks-auth-login
port = http,https
logpath = /var/log/nginx/docketworks_*_access.log
maxretry = 10
findtime = 10m
bantime = 1h

[docketworks-auth-refresh]
enabled = true
filter = docketworks-auth-refresh
port = http,https
logpath = /var/log/nginx/docketworks_*_access.log
maxretry = 60
findtime = 10m
bantime = 15m
