  # PUT became PATCH on the same resource; the shape of the change (partial
  # update semantics) is the same rename pattern as the entry moves above.
  process_forms_update: process_forms_partial_update
  process_forms_entries_update: process_entries_partial_update
introduced:
# Specified by ADR 0007 and the payroll UI contract but never built in v1:
# what Xero holds for a week, read live, beside what the timesheet recorded.
# Its own endpoint so the weekly grid still renders when Xero is unreachable.
- timesheets_payroll_week_status_retrieve
# v1's payroll reconciliation could only read the synced XeroPaySlip mirror, so
# it answered nothing until the run was Posted and a sync had mirrored it — by
# which time a wrong week has been paid. This reads the week's run live, and is
# driven from Xero's pay slips rather than our staff list so the costliest case
# surfaces: an employee Xero pays that DocketWorks posted nothing for.
- accounting_reports_payroll_week_reconciliation_retrieve
# The state of the payroll posting run, polled. v1 posted synchronously and
# reported through the response body, so a reload lost the run and a second post
# could start over a live one. ADR 0047's contract needs a GET whose schema is
# what generates the frontend types; the SSE stream pushes this same document.
- timesheets_payroll_runs_retrieve
# Admin-created leave is a new v2 workflow; v1 only had raw timesheet lines.
- timesheets_leave_balance_retrieve
- timesheets_leave_office_closure_create
- timesheets_leave_office_closure_preview_create
- timesheets_leave_preview_create
- timesheets_leave_requests_create
- timesheets_leave_requests_delete
- timesheets_leave_requests_list
- timesheets_leave_requests_update
- timesheets_leave_settings_retrieve
- timesheets_leave_settings_update
# One narrow job list for the admin screens that map a fixed kind of job. v1 had
# no such screen, and its pickers were fed by whichever domain list the page
# already loaded — which is how v2 briefly grew a third job-option schema.
- job_jobs_options_list
# v1's entry endpoints were nested one level under a single owning form and
# carried no audit trail. v2 adds a flat, cross-form entry list — the same
# resource an entry's parent_entry link already reaches across forms (a
# meeting entry's action items) — and a per-entry history read backed by
# ProcessEvent, which v1 had no equivalent model for.
- process_entries_list
- process_entries_history_list
# The entry form's staff picker needs an any-staff staff list (any staff may
# sign a form entry), but /api/timesheets/staff/ is SuperuserCookieJWTAuth-
# gated — it exposes other staff members' pay data, which v1 had no
# equivalent form-entry concept to need reading around.
- process_staff_options_list
dropped:
  timesheets_payroll_pay_runs_create_create: >-
    Creating the Draft pay run is a step of posting, not an operator intent:
    posting reconciles leave BEFORE creating the run because Xero locks leave
    once the employee is in a draft (KAN-326), and a standalone create invited
    exactly that early creation. ensure_pay_run_for_week runs inside the post.
  timesheets_payroll_pay_runs_refresh_create: >-
    Mirror hygiene is the server's job, not a button: the posting preflight
    refreshes the mirror before judging the week, and the hourly sync keeps it
    roughly current for reads. The panel's postable-week banner is advisory.
  process_forms_destroy: >-
    Archive replaces delete: a form's audit trail cannot vanish with the form
    (owner ruling, design doc 2026-08-25).
  process_forms_fill_create: >-
    Fill is entry-create: one operation (process_forms_entries_create) serves
    both the entries page and the Fill dialog.
