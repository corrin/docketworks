# Behaviour ledger. Nothing gates on this file — the schema-parity diff that
# once failed CI on unlisted deviations was deleted 2026-08-07, along with v1's
# frozen schema and ADR 0044.
#
# What still belongs here: a v2 BEHAVIOUR that differs from v1 in a way someone
# would otherwise rediscover and "fix" back — a status code that moved, a v1
# defect deliberately not reproduced, a report definition that had to be chosen.
# What no longer belongs: schema shape differences. v2's API is free to be
# better than v1's; it needs no permission slip.

- operation: accounts_token_create
  change: "Wrong password returns 401 (was 400)"
  reason: >
    v1's CustomTokenObtainPairSerializer raised DRF ValidationError (400)
    while its own OpenAPI schema documented 401. v2 implements the documented
    contract. Response body is ninja's {"detail": "Unauthorized"}.

- operation: accounts_token_create
  change: "password_reset_url omitted from login response (was optional)"
  reason: >
    v1 built it via reverse("accounts:password_change"); endpoint not yet
    ported. password_needs_reset boolean still returned. Restore when the
    password-change endpoint ports.

- operation: accounts_token_verify_create
  change: "Endpoint not ported"
  reason: >
    Present in v1's schema but referenced only by the generated client —
    zero app-code call sites in v1's frontend. Dead surface.

- operation: (auth-wide)
  change: "ENABLE_JWT_AUTH toggle dropped; cookie auth always on"
  reason: >
    v1 ran with it enabled everywhere except .env.precommit. Tokens never
    appear in response bodies in v2.

- operation: (error-envelope-wide)
  change: "Request-validation errors return ninja's 422 list (v1/DRF: 400 field-dict)"
  reason: >
    Framework-native shape; no external party holds these responses and the
    new frontend consumes the generated client. Adversarial review 2026-08-01
    caught this claimed-but-unrecorded deviation.

- operation: (error-envelope-wide)
  change: "error_id present in every error envelope; 500 bodies carry the verbatim message"
  reason: >
    ADR 0038 (transparent errors, trusted environment): rapid debugging
    outranks disclosure hygiene in a single-tenant locally-installed app.
    v1's opaque Django-default 500s are deliberately NOT reproduced.

- operation: (middleware)
  change: "v1's AccessLogging/DisallowedHost/FrontendRedirect/PasswordStrength middlewares deferred"
  reason: >
    Phase deferrals, now recorded: AccessLogging + DisallowedHost are ops
    concerns (Phase 5), FrontendRedirect needs the deployed SPA (Phase 5),
    PasswordStrength belongs to the accounts password flows (Phase 3).
    Consequence until then: JWT-only users on non-API paths hit the SPA login
    redirect (no non-API surface exists yet).

- operation: (auth 401s)
  change: "401 rejection details restored: 'User is inactive.', token-error strings (v1 parity)"
  reason: >
    ADR 0038. CookieJWTAuth raises AuthenticationError with the specific
    reason for invalid tokens and departed staff; missing cookie still falls
    through as generic no-credentials.

- operation: (frontend transport)
  change: "Outbound trimming skips secret-bearing keys (v1 trimmed passwords too)"
  reason: >
    Trimming a password whose stored hash includes edge whitespace makes it
    silently unusable via the SPA ("wrong password", no diagnosis path). The
    SPA is the only consumer of the auth endpoints, so no external contract
    moves. Ultra review 2026-08-02.

- operation: (frontend concurrency)
  change: "412/428 on delivery-receipt POSTs now handled (v1: raw axios error, no toast/reload)"
  reason: >
    v1 extracted resource ids from URLs only, so body-referenced POs fell
    through its own concurrency UX. v2's idForMutation reads the body -
    keeping the fix; a silent raw error is strictly worse.

- operation: companies_update_update / companies_update_partial_update
  change: "Blank name/address/flags rejected with 422 (v1 silently blanked the company); null rejected with 422 (v1: 400)"
  reason: >
    The two inputs had different v1 behaviours and only the blank one is a
    behaviour change. v1's guard (`not data.get("name") and not company.name`)
    was dead code — company.name is never blank on an existing row — so an
    explicit {"name": ""} silently blanked the company. Inherited bug fixed.
    An explicit null never reached that guard: v1's CompanyUpdateRequest
    declares name/address/is_account_customer/allow_jobs without
    `nullable: true`, so DRF refused it at validation with a 400. v2 refuses it
    too, at the same point, differing only in the status code the
    envelope-wide convention below already covers. Ultra review 2026-08-02.

    Revised 2026-08-06: rejection moved from the service (400) to schema
    validation (422), which is the envelope-wide convention above and is where
    v1's serializer refused it too (`minLength: 1`). The fields also stopped
    accepting null: they were declared `str | None = None`, where the `| None`
    only ever meant "may be omitted", so `{"name": null}` passed validation and
    the handler's `is not None` guard dropped it — a 200 that changed nothing.
    They now use `omittable()`, which keeps them optional while making null a
    422; presence is read from `model_fields_set`. `email` stays nullable
    because null clears it, and `phone` accepts "" because blank clears the
    contact method. The service's blank-name guard is retained as a boundary
    check for non-API callers, though the API can no longer reach it.

- operation: (company merge)
  change: "Source primaries deleted as destination duplicates now promote the destination counterpart"
  reason: >
    v1 deleted the source's duplicate contact methods before its lazy
    source queryset evaluated which primaries were moving, so a source
    primary that duplicated a destination row vanished and its primary flag
    was silently lost. v2 captures the moving primaries first and promotes
    the destination's matching row. Ultra review 2026-08-02.

- operation: (model-layer)
  change: "JobEvent description builders fail fast on corrupt payloads v1 rendered"
  reason: >
    Three edges (non-str legacy_description, non-str manual note_text, float
    priority positions) rendered under v1 and now raise/sentinel under v2.
    Only reachable with malformed stored event payloads; ADR 0015 posture is
    consumers stay strict and data gets fixed. Adversarial review 2026-08-01.

- operation: (model-layer)
  change: "PurchaseOrder.reconcile() DELETED as dead code (review item closed)"
  reason: >
    The method iterated line.received_lines, a related_name no model defines
    (v1 or v2), so it raised AttributeError for any PO with lines. Evidence
    for deletion, gathered in the Phase 3c-2 purchasing port: grep over the
    whole v1 tree (backend, frontend, templates, tasks, admin, tests) finds
    zero callers of `.reconcile(`, and no v1 URL or Celery task reaches it.
    ADR 0039 (divergence is never load-bearing / dead code goes). The live
    implementation of "derive the PO status from received quantities" is
    apps/purchasing/services/allocation_service.recompute_purchase_order_status,
    reached by the delivery-receipt and allocation-delete paths.

- operation: crm_phone_calls_list
  change: "Loose v1 query values (page=last, has_recording=yes) now 422"
  reason: >
    v1's DRF pagination accepted page=last and truthy-string booleans; v2's
    typed filters reject them. The generated client sends ints/bools, so no
    real caller is affected. Adversarial review 2026-08-02.

- operation: job_jobs_update / job_jobs_partial_update
  change: "Unknown or read-only keys in the delta envelope's `after` now 400 (v1 silently ignored)"
  reason: >
    v1's JobSerializer(partial=True) dropped keys it did not recognise, so a
    client typo (or an attempt to write a read-only field) was a silent
    no-op that still recorded a delta event. v2's explicit dispatch table
    rejects unsupported fields with "Unsupported field '<name>' in delta
    payload" — a 400 the client can see. Adversarial review 2026-08-02.

- operation: job_jobs_update / job_jobs_partial_update
  change: "Invalid job_status values rejected with 400 (v1 accepted anything into the DB)"
  reason: >
    v1's serializer routed job_status through a plain CharField source, so a
    value outside JOB_STATUS_CHOICES was written verbatim to the status
    column (choices are not DB-enforced). v2 validates against the choice
    set (likewise pricing_methodology, speed_quality_tradeoff, rdti_type).
    Adversarial review 2026-08-02.

- operation: job_jobs_update / job_jobs_partial_update
  change: "Hard-fail delta rejection rows persist detail {server_checksum, current_values} (v1 stored detail=None)"
  reason: >
    v1's service-level DeltaValidationError recording passed no detail, so
    the forensics row said only "checksum mismatch" with nothing to compare
    against. v2 stores the server-side checksum and the current field values
    the client lost to, making "my edit didn't save" diagnosable from the
    rejection row alone. Adversarial review 2026-08-02.

- operation: job_jobs_costs_summary_retrieve
  change: "costs/summary profitMargin now margin-on-revenue: (rev-cost)/rev*100 (v1 reported markup-on-cost there)"
  reason: >
    v1 carried two formulas under the same field name: CostSetSerializer
    computed (rev-cost)/rev*100 while JobCostSummaryRestView computed
    (rev-cost)/cost*100 — user standardised on margin-on-revenue 2026-08-02
    (zero denominator -> 0.0). Cost-set reads are unchanged; the two
    endpoints now agree.

- operation: job_cost_lines_partial_update
  change: "Explicit JSON null for optional scalar PATCH values is ignored (v1/DRF rejected null with 400)"
  reason: >
    v2's partial-update collector applies only provided non-null scalar
    fields, so {"quantity": null} is a no-op where v1's DRF serializer
    answered a 400 field error. FK fields (xero_pay_item, staff,
    labour_subtype) still accept explicit null to clear. Adversarial review
    2026-08-02.

- operation: job_jobs_cost_sets_quote_revise_create
  change: "revisions[].archived_at is timezone-aware UTC ISO-8601 (v1: naive local datetime.now())"
  reason: >
    v1 archived datetime.now().isoformat() with no tzinfo, making revision
    timestamps ambiguous across DST/timezone changes; v2 records
    timezone.now(). Adversarial review 2026-08-02.

- operation: job_jobs_cost_sets_cost_lines_create / job_cost_lines_partial_update
  change: "Blank desc ('') on cost-line writes returns 400 (v1: 500 via its own desc_not_blank DB constraint)"
  reason: >
    v1's serializer let blank desc through to the database, where the
    desc_not_blank check constraint raised IntegrityError (500, verified
    against v1's live schema). v2's CostLine.save() runs full_clean with
    constraint validation, surfacing the same rule as a 400. Adversarial
    review 2026-08-02.

- operation: updateJobFile
  change: "Rename sanitises the filename to a bare name (v1 wrote traversal paths)"
  reason: >
    v1 took the client filename verbatim, so "../../x" renamed the file
    outside DROPBOX_WORKFLOW_FOLDER and poisoned file_path for every later
    read/delete/stat. v2 sanitises (Path(name).name) and re-checks
    containment; a bare ".." is a 400. Adversarial review 2026-08-02.

- operation: job_workshop_timesheets_create / job_workshop_timesheets_partial_update
  change: "Workshop-entered time on a leave job now uses the job's leave pay item and bills 0.00 (v1 billed it as work)"
  reason: >
    v1 carried three time-pricing pipelines over one shared primitives module.
    The costing serializer and the modern-timesheet view resolved the Xero pay
    item from the JOB (resolve_xero_pay_item_for_job), so a leave job forced its
    leave type, a 1x wage multiplier (0x unpaid) and a 0x bill multiplier.
    apps/job/services/workshop_service.py resolved it from the wage multiplier
    ALONE, so a workshop staffer booking their own leave got an earnings-rate
    pay item and a customer-billable line. v2 has one pipeline
    (apps/job/services/time_entry_rates.py, ADR 0039) and keeps the job-aware
    behaviour: billing customers for staff leave was a bug. User decision
    2026-08-03.

- operation: (time pricing — job_jobs_cost_sets_cost_lines_create, job_jobs_cost_sets_actual_cost_lines_create, job_cost_lines_partial_update, job_workshop_timesheets_create, job_workshop_timesheets_partial_update)
  change: "Time pricing fails when a staff member has no wage rate (v1 costing fell back to CompanyDefaults.wage_rate; v1 workshop costed 0.00) — ADR 0015, user decision 2026-08-03."
  reason: >
    Both v1 fallbacks silently produced wrong job costs for a staff member whose
    wage rate was never configured: the costing serializer substituted the
    company default rate and the workshop service costed the line at 0.00.
    apps/job/services/time_entry_rates.staff_wage_rate now raises instead, and
    every write endpoint that prices time surfaces it as a 400 whose message
    names the staff member (ADR 0038), so the fix is one edit on their record.
    No model constraint or migration — a fail-early guard in the pricing
    pipeline only.

- operation: job_workshop_timesheets_partial_update
  change: "A wage_rate_multiplier-only PATCH no longer re-bills a non-billable workshop line"
  reason: >
    v1's WorkshopTimesheetService SET bill_rate_multiplier from the wage
    multiplier whenever wage_rate_multiplier was patched without an explicit
    bill_rate_multiplier, so bumping a non-billable line to 1.5x silently began
    billing the customer at 1.5x. v2 drops the stored multiplier instead and
    lets the pipeline re-derive it, which leaves an explicitly non-billable line
    at 0.00 while still applying the wage change to unit_cost. Same class of bug
    as the leave-billing fix (v1 billing things that must not be billed).
    Adversarial review 2026-08-03.

- operation: timesheets_payroll_pay_runs_retrieve
  change: "next_postable_week_* is null when the payroll calendar has no pay runs (v1 read the anchor period from Xero)"
  reason: >
    v1's third postable-week case fetched the calendar's anchor period via the
    Xero Payroll API, which is Phase 4. Null is already part of this field's v1
    contract (the schema tells the client to fall back to the current week), and
    a READ endpoint must not fail because a Xero capability is unported — the
    gap is logged at WARNING. Creating and refreshing pay runs remain loud Phase
    4 seams. Adversarial review 2026-08-03.

- operation: job_workshop_timesheets_retrieve / job_workshop_timesheets_create / job_workshop_timesheets_partial_update
  change: "Echoed wage_rate_multiplier / bill_rate_multiplier are quantized to 2dp (1.555 -> 1.56)"
  reason: >
    v2 routes every multiplier through the single rate pipeline, whose
    normalize_multiplier quantizes to cents before pricing and before writing
    meta; v1's workshop serializer echoed the raw stored value while pricing
    with the quantized one. The echoed value now matches the value actually
    used. v1's own field bound (max_digits=4, decimal_places=2) never permitted
    more than 2dp on input. Adversarial review 2026-08-03.

- operation: (purchasing-wide — PO mutations, delivery receipts, allocations)
  change: "Error bodies use the v2 envelope, not v1's {success,error,details:{error_id}}"
  reason: >
    v1's purchasing views hand-built PurchaseOrderMutationErrorResponse /
    PurchasingErrorResponse bodies. v2 answers with the single ADR 0013
    envelope {"detail", "error_id"} that every other v2 endpoint uses; status
    codes (400/404/412/428/500) are unchanged. Phase 3c-2.

- operation: purchasing_delivery_receipts_create
  change: "A per-allocation retail_rate is now applied (v1 silently ignored it)"
  reason: >
    v1's DeliveryReceiptAllocationSerializer declared `retail_rate`, but
    delivery_receipt_service read the override as `alloc.get("retailRate")` —
    a key DRF's validated_data never contains — so every custom markup fell
    back to CompanyDefaults.materials_markup. v2 honours the documented
    field. Phase 3c-2.

- operation: createPurchaseOrder / purchasing_purchase_orders_partial_update
  change: "A blank reference is stored as NULL (v1 wrote '' and 500ed on its own constraint)"
  reason: >
    v1's create passed data.get("reference", "") straight to the model, and
    the reference_not_blank check constraint rejected it, so creating a PO
    with no reference was a 500. v2 treats blank as unset (NULL), matching how
    every other nullable text field on the model behaves.
    DO NOT RE-FLAG: that constraint is invisible in v1's models.py — it was
    added by a raw-SQL migration and exists only in v1's live schema (the same
    pattern Phase 2's constraint sweep found). Confirmed against v1 production:
    the constraint is present on purchasing_purchaseorder and the data agrees
    (0 blank, 167 NULL of 913 rows). Phase 3c-2; re-confirmed adversarial
    review 2026-08-03.

- operation: purchasing_purchase_orders_partial_update
  change: "A pickup address must belong to the PO's supplier, and changing the supplier drops it (v1 accepted any active address and kept it across a supplier change)"
  reason: >
    v1's _update_pickup_address looked the id up with is_active=True only, so
    an id from another company — a stale client, a hand-typed request — was
    linked and printed on the PO as the collection point, and a PO moved to
    another supplier kept the old supplier's yard. The screen only ever offers
    the supplier's own addresses, so a foreign id is a mistake; v2 refuses it
    with a 400, and a supplier change clears the address unless the same
    request names a new one.

- operation: createPurchaseOrder
  change: "pickup_address_id: unsent means the supplier's primary, null means none (v1 treated both as 'pick the primary')"
  reason: >
    v1 auto-selected the primary whenever the id was falsy, so a client could
    not create a PO with no pickup address while the supplier had a primary.
    Unset is NULL (ADR 0040): a null the client sends is a choice, and only an
    absent key defers to the primary. An id from another company is a 400.

- operation: purchasing_purchase_orders_partial_update
  change: "Omitted PO-line fields keep their stored value (v1 reset quantity/price_tbc to defaults)"
  reason: >
    v1's PurchaseOrderLineUpdateSerializer declared quantity default=0 and
    price_tbc default=False, so DRF put them in validated_data even when the
    client did not send them — an update that touched only a description
    silently zeroed the quantity. v2 writes only the fields present in the
    request. Phase 3c-2.

- operation: purchasing_purchase_orders_partial_update
  change: "An unknown PO status is rejected with 400 (v1 wrote any string to the column)"
  reason: >
    status choices are not DB-enforced, so v1's CharField serializer let a
    client typo through into the column. v2 validates against the model's own
    choice set, the same posture taken for job_status in Phase 3b-1.
    Phase 3c-2.

- operation: deleteAllocation
  change: "Deleting an allocation always bumps the PO's updated_at (and therefore its ETag)"
  reason: >
    v1 had two copies of the PO status recompute: the delivery-receipt one
    always wrote updated_at, the allocation-delete one skipped the write when
    the status label was unchanged — leaving clients holding a stale ETag for
    a PO whose received quantities had changed. v2 has one implementation
    (ADR 0039) and keeps the always-bump behaviour required by ADR 0003.
    Phase 3c-2.

- operation: deleteAllocation
  change: "The {line_id} path segment is not used to resolve the allocation"
  reason: >
    v1 accepted line_id in the URL but resolved the PO line from the
    allocation row's own back-reference; trusting the URL would let a caller
    decrement a different line's received_quantity. v2 keeps the resolution
    from the row (and the URL segment, for path parity). Phase 3c-2.

- operation: purchasing_purchase_orders_allocations_retrieve
  change: "An unpriced stock allocation reports retail_rate 0 instead of crashing the endpoint"
  reason: >
    v1 evaluated Stock.retail_rate in a truthiness test; that property raises
    ValueError when unit_cost is zero/unset, so a single unpriced stock row
    500ed the whole allocations listing. v2 reports no markup for such a row.
    Phase 3c-2.

- operation: approveCostLine
  change: "Approving a material line persists the quantity it assigns (v1 dropped it)"
  reason: >
    v1's consume_stock() assigned line.quantity = qty and then omitted
    "quantity" from save(update_fields=...), so an approval that changed the
    quantity silently lost the change. v2 persists every field it assigns.
    Phase 3c-2.

- operation: approveCostLine
  change: "Response is one schema; v1 declared a polymorphic union"
  reason: >
    v1's CostLineApprovalResult was oneOf[StockConsumeResponse,
    CostLineApprovalResponse], which differ only in the optional
    remaining_quantity. v2 serves a single schema whose remaining_quantity is
    present exactly when a stock row was drawn down. Phase 3c-2.

- operation: (purchasing — stock writes)
  change: "Stock writes no longer queue the LLM metadata parser"
  reason: >
    v1 queued apps.purchasing.tasks.parse_stock_item_task (which calls
    apps.quoting.services.stock_parser) after every stock create/update to
    infer missing metal_type/alloy/specifics. The quoting AI slice is not
    ported, so v2 stores exactly the metadata the caller supplied; the two
    call sites are marked "STOCK METADATA PARSER SEAM" in
    apps/purchasing/services/stock_service.py. Phase 3c-2 deferral.

- operation: (purchasing — search telemetry)
  change: "Stock search writes no SearchTelemetryEvent row"
  reason: >
    Same deferral already recorded for company and kanban search: domain apps
    may not import the apps.search integration (layer contract), so the
    telemetry write returns with the search-app port. Phase 3c-2.

- operation: getPurchaseOrderEmail
  change: "Response carries mailto_url, and recipient_email/message actually affect it"
  reason: >
    v1's view put mailto_url into response_data, but
    PurchaseOrderEmailResponseSerializer did not declare the field, so DRF
    dropped it and the client never received the one value the endpoint exists
    to produce. v1 also applied both overrides AFTER building the URL — it set
    email_data["email"] (a key its serializer never emitted) and prepended the
    custom message to the body — so recipient_email was entirely inert and the
    body and URL disagreed. v2 composes the URL last, from the final recipient,
    subject and body: returning a validated recipient_email and then ignoring
    it would be a silent no-op. pdf_url stays absent — v1 never populated it.
    Phase 3c-2; extended adversarial review 2026-08-03.

- operation: purchasing_delivery_receipts_create
  change: "Success body is {\"success\": true, \"error\": null} (v1 omitted the null error key)"
  reason: >
    ninja serialises the declared optional field as null where DRF omitted an
    unprovided non-required field. Same additive shape difference already
    accepted elsewhere in v2; the generated client treats both as absent.
    Phase 3c-2.

- operation: purchasing_jobs_retrieve
  change: "Documented as a list of jobs (v1's schema advertised an object envelope it never returned)"
  reason: >
    v1 declared serializer_class = PurchasingJobsResponseSerializer
    ({jobs, total_count}) but the view returned a bare list of job dicts —
    except on the empty path, where it returned {"jobs": []}. v2 always
    returns the list, which is what the frontend consumed. Phase 3c-2.

- operation: purchasing_purchase_orders_partial_update
  change: "unit_cost and price_tbc are independent request fields; the TBC invariant reads the line's flag"
  reason: >
    Two changes, both from the adversarial review 2026-08-03. (1) Each field is
    written only when its own key is present, matching v1's per-field
    FIELD_UPDATERS; an implementation that coupled them nulled unit_cost on a
    price_tbc-only PATCH (the "price TBC" checkbox), which then hard-failed
    every receipt and allocation path for that line. (2) When a unit_cost IS
    supplied, whether it is stored is decided by the line's effective price_tbc
    flag (after any flag in the same payload), not by the payload alone. v1
    diverged from itself here: its create path enforced "price_tbc wins" while
    its update path did not, so a PATCH could store a cost on a line whose own
    help_text says it has none. v2 keeps the invariant on both paths (ADR 0039,
    one canonical behaviour).

- operation: purchasing_delivery_receipts_create
  change: "A metadata key present but blank clears the field instead of inheriting the PO line's value"
  reason: >
    Restores v1's three-way rule, metadata.get(field, line.field) or None:
    absent key inherits the ordered value, present-but-blank means the operator
    cleared it, present-with-value wins. An implementation that collapsed the
    first two handed a cleared metal_type/alloy/specifics/location back the
    value that was ordered. Adversarial review 2026-08-03.

- operation: purchasing_purchase_orders_partial_update
  change: "status=fully_received on a price-TBC line returns 400 (v1: 400 for stock lines, 500 for job lines)"
  reason: >
    Moving a PO to fully_received auto-allocates every line, which needs a
    confirmed unit cost. v2 guards this explicitly and answers 400. v1 had no
    guard and crashed differently per branch: a stock-bound line raised
    ValueError from the Stock.retail_rate setter, which its
    http_status_for_exception mapped to 400, while a job-bound line raised
    TypeError multiplying a None unit cost and fell through to 500. v2 is exact
    parity on the stock branch and an improvement on the job branch.
    Adversarial review 2026-08-03.

- operation: (purchasing — delivery receipts, KNOWN DEBT, ported deliberately)
  change: "Re-receipting a line deletes its prior stock rows but keeps accumulating received_quantity"
  reason: >
    v1 behaviour, ported as-is and recorded because it is a real stock-vs-books
    divergence, not a design intent: process_delivery_receipt deletes the
    line's existing purchase_order-sourced Stock rows and then increments
    received_quantity by the new total, so a line received twice can read
    fully_received while only the last receipt's stock exists. Not fixed here
    because changing it would silently alter received totals on migrated data;
    it needs a deliberate stock-reconciliation decision. Covered by
    test_re_receipting_a_line_replaces_stock_but_accumulates_received.
    Adversarial review 2026-08-03.

- operation: consumeStock / approveCostLine
  change: "Default unit_rev is quantized to cents"
  reason: >
    v1 stored the raw unit_cost * (1 + materials_markup) product, which carries
    4 decimal places for a 2dp markup. v2's CostLine.save() runs full_clean, so
    the unrounded value is a 400 for most markups (e.g. 20.00 x 1.20). v2
    quantizes to cents, which is the value Postgres stored in v1 anyway
    (numeric(10,2)). The receipt path already quantized. Adversarial review
    2026-08-03.

- operation: createPurchaseOrder
  change: "dimensions is written on PO create (v1 accepted the field and dropped it)"
  reason: >
    v1's PurchaseOrderLineCreateSerializer declared dimensions and its update
    path wrote it (_create_line and FIELD_UPDATERS both include it), but
    create_purchase_order's PurchaseOrderLine.objects.create(...) omitted the
    field, so a dimension entered on a brand-new PO was silently lost until the
    line was edited. v2 uses one line-write path for both. Adversarial review
    2026-08-03.

- operation: (purchasing — stock service)
  change: "merge_stock_into() not ported"
  reason: >
    Dead in v1 on the same criterion that retired PurchaseOrder.reconcile():
    grep over the whole v1 tree finds no caller other than v1's own lazy
    re-export in apps/purchasing/services/__init__.py — no view, task, command
    or admin action reaches it. ADR 0039. Restore it with a caller if a stock
    merge surface is ever specified. Adversarial review 2026-08-03.

- operation: purchasing_purchase_orders_partial_update / createPurchaseOrder
  change: "Nullable PO-line text fields are nullable-and-nonblank; \"\" is a 422 (KAN-329)"
  reason: >
    KAN-329 (live v1 bug): confirming a TBC price on a line with no item code
    fails with 409. v1's frontend rebuilt the whole line and sent item_code
    "", v1's serializer accepted blanks but not null, and the service assigned
    the blank straight to the model — where the item_code_not_blank CHECK
    constraint (v1's live schema and v2's) raised IntegrityError, mapped to
    409, rolling back the price. v1 coerced blanks for five sibling fields
    (metal_type, alloy, specifics, location, dimensions) and forgot this one,
    so the contract had drifted field by field.
    Per the ticket's fix direction, v2 corrects the CONTRACT rather than adding
    a `value or None` compatibility shim: the schema type NullableText declares
    every nullable PO-line text field optional/nullable and nonblank when
    non-null, identically on create and update. "" is rejected with 422 before
    the database; null (or omission) is how a client clears one; the service
    assigns validated values directly. Declared once, so the OpenAPI schema and
    generated TS client inherit it and a newly added nullable field cannot
    regress the contract. Covered by parametrised tests over the whole field
    set plus the end-to-end TBC-price scenario.

- operation: purchasing_stock_create / purchasing_stock_update / purchasing_stock_partial_update
  change: "Nullable Stock text fields are nullable-and-nonblank; \"\" is a 422 (ADR 0040)"
  reason: >
    Same contract as the PO-line entry above, extended to the stock surface.
    v1's StockItemSerializer coerced "" to NULL, and the first v2 port kept
    that shim per-schema plus a service-side `value or None` — leaving the
    live contract split: "" on a PO line was a 422 while the identical PATCH
    on a stock row silently wrote NULL. The five fields (item_code, location,
    metal_type, alloy, specifics) now share the NullableText type: "" is a 422
    before the *_not_blank CHECK constraints, null clears. PR #19 review
    finding, fixed 2026-08-04; parametrised tests over the whole field set.

- operation: purchasing_product_mappings_validate_create
  change: "Nullable mapping text fields are nullable-and-nonblank; \"\" is a 422 (ADR 0040)"
  reason: >
    The third sibling of the PO-line and stock entries: mapped_* text fields
    and validation_notes on the validate body are NullableText; v1 coerced ""
    serializer-side. mapped_unit_cost stays Decimal|None (unaffected). PR #19
    review finding, fixed 2026-08-04.

- operation: company_pickup_addresses_create / company_pickup_addresses_partial_update
  change: "Nullable pickup-address text fields are nullable-and-nonblank; \"\" is a 422 (ADR 0040)"
  reason: >
    The last _blank_to_none holdouts. v1's SupplierPickupAddressSerializer
    coerced "" to None in to_internal_value for suburb, state, postal_code,
    google_place_id and notes (and lat/long); v2 initially ported the
    coercion. Same correction as the PO-line/stock/mapping entries: the five
    text fields are NullableText ("" and whitespace-only are 422 before the
    *_not_blank CHECK constraints; null clears). latitude/longitude are
    float|None — "" was already a 422 there in v2. The one NullableText now
    lives in apps/core/schemas (company cannot import purchasing).
    Tier 2 cleanup, 2026-08-04.

- operation: (quoting product parsing)
  change: '"The parser has run" is parser_version at the current version, not mapped_item_code IS NOT NULL'
  reason: >
    User decision 2026-08-03. v1 keyed both the end-of-run fill's work list and
    its notion of "unpopulated" on `mapped_item_code__isnull=True`, so any
    product the model could not name an item code for was re-parsed every
    weekly scrape, forever, at one LLM call each. v2 marks the attempt with
    `parser_version`, which is stamped whenever the parser runs regardless of
    outcome: such a product is "parsed, no item code found" and is left alone.
    Matching the CURRENT PARSER_VERSION (rather than merely "not null") makes a
    version bump the deliberate re-run lever after a prompt change. One
    predicate, `product_parser.AUTHORITATIVE_MAPPING`, drives both the cache
    lookup and the fill's work list so they cannot diverge again — v1 asked two
    different questions here, which is why its fill silently did nothing (559
    of 1,203 mappings never parsed in the 2026-08-01 restore; 0 of 7,614
    supplier products enriched).

- operation: (quoting product parsing)
  change: "The end-of-run fill never re-parses or overwrites an operator-validated mapping"
  reason: >
    User decision 2026-08-03. v1's `populate_all_mappings_with_llm` selected
    purely on `mapped_item_code__isnull` and then issued a full `mapping.save()`
    from an instance snapshotted before the LLM round-trip, so a fill running
    while an operator validated the same mapping on
    `/api/purchasing/product-mappings/{id}/validate/` silently reverted their
    correction, `is_validated` included. v2 excludes validated mappings from the
    work list, returns them untouched from `_save_mapping`, and scopes the write
    with `update_fields` so the validation columns can never be part of it.
    Silently reverting a correction would make the review screen untrustworthy.

- operation: (accounting-reports-wide)
  change: "Error bodies use the v2 envelope {detail, error_id}, not v1's StandardErrorSerializer {error, details}"
  reason: >
    Every v1 accounting view hand-built {"error": ...} bodies through
    StandardErrorSerializer with per-view blanket try/excepts. v2's exception
    handlers (apps/core/envelope.py) already produce the one envelope every
    other surface uses, persist the AppError, and carry error_id; no external
    party holds these response shapes and the new frontend consumes the
    generated client.

- operation: accounting_reports_job_aging_retrieve
  change: "days_in_current_status now actually measures the latest status change"
  reason: >
    v1 filtered JobEvents on event_type="status_change", a value nothing ever
    writes (the tracker emits "status_changed"), so the branch was dead and
    every job silently reported days-since-creation instead. v2 filters on the
    real event type. v1 defect, recorded in rewrite-status.

- operation: accounting_reports_job_aging_retrieve
  change: "last_activity_date is a plain date (v1 schema declared date-time)"
  reason: >
    v1's service always supplied a bare ISO date; its serializer just declared
    the field DateTimeField. v2 types what is actually sent.

- operation: accounting_reports_rdti_spend_retrieve
  change: "The endpoint can now answer at all (v1 500'd on every call)"
  reason: >
    Two independent v1 causes, either fatal alone: the aggregation mixed
    Decimal sums with float 0.0 in Coalesce without an output_field (Django
    raises at queryset evaluation), and the response serializer validated
    rdti_type against RDTIType.choices while the service's summary always
    contains an "unclassified" row. v2 sets an explicit DecimalField
    output_field and types the category as a plain string. v1 defect,
    recorded in rewrite-status.

- operation: (accounting-reports-wide)
  change: "Hand-built 400 parameter rejections are ninja 422 request-validation errors"
  reason: >
    v1 views hand-validated year/month ranges, date ordering, month format,
    and baseline_days positivity, returning 400 with per-view error bodies.
    v2 expresses the same rules as request validation, which the envelope
    returns as 422 (consistent with the existing envelope-wide entry). Same
    rules, same rejections, one shape.

- operation: sales_forecast_month_detail
  change: "500-on-unknown-exception replaced by the envelope (and comparison quote-usage removed)"
  reason: >
    v1 computed a comparison-period quote_usage_percent that no response
    field ever carried — dead code, dropped in the hoist to a service. No
    wire field changes beyond the envelope entries already recorded.

- operation: job_month_end_create
  change: "Per-job failures land in errors[] as strings (v1: any failure 400'd the whole response)"
  reason: >
    v1's service returned (job_id, message) tuples while its serializer
    declared errors as strings, so DRF rejected the service's own output and
    a single bad job id blew up the entire month-end run. v2 serves the
    declared OpenAPI contract: "<job_id>: <message>". v1 defect, recorded in
    rewrite-status.

- operation: accounting_reports_payroll_reconciliation_retrieve
  change: "A pay slip with no employee_name and no Staff match fails loudly"
  reason: >
    v1 keyed the reconciliation row on None and 500'd opaquely inside the
    serializer. v2 raises a descriptive error naming the slip and persists it
    with report context (ADR 0015/0038). Same outcome class (the request
    fails), but diagnosable.

- operation: accounting_reports_staff_performance_summary_retrieve
  change: "A period with no recorded hours returns 200 with zeroed team averages (v1: 500)"
  reason: >
    v1's empty-team branch returned only 4 of the 8 keys its own response
    serializer required, so any period with no time lines 500'd. v2's
    empty-team averages carry all 8 keys as zeros. v1 defect.

- operation: (accounting-reports-wide)
  change: "A job with no company renders company_name as empty string instead of 500ing the report"
  reason: >
    Job.company is nullable, and v1 was inconsistent: job aging rendered
    "No Company" while the KPI job breakdown and sales-forecast month detail
    dereferenced job.company.name unguarded, 500ing the entire report for
    one company-less job. v2 keeps each report's rendering (job aging: "No
    Company"; others: "") but never fails the whole report on it. Not a
    read-side data fallback (ADR 0015): a NULL company is a legal model
    state, not malformed data.

- operation: (accounting-reports-wide)
  change: "\"Today\" is timezone.localdate() (Pacific/Auckland), not the host OS clock"
  reason: >
    v1 used datetime.date.today() for the KPI elapsed-day boundary, the KPI
    year/month defaults, and the WIP default report date — correct only when
    the host OS timezone is NZ. v2 uses settings TIME_ZONE, deterministic on
    any host. If v1 production runs a UTC host, v1's "today" is NZ-yesterday
    every morning until ~noon; verify at cutover if KPI elapsed counts look
    shifted.

- operation: accounting_reports_job_aging_retrieve
  change: "Malformed data stops the report (v1: silently degraded the row and unsorted the report)"
  reason: >
    A corrupt staff reference on an actual time line made v1 blank the job's
    last-activity fields, then the null sort key raised a TypeError that v1
    swallowed, returning the ENTIRE report unsorted. v2 persists the AppError
    naming the job and cost line and fails the request: fix the data, never
    read around it (ADR 0015). User decision 2026-08-04. The production
    restore holds zero such rows (verified against the 2026-08 load), and
    v2's model validation plus DB check constraint prevent new ones. The WIP
    report's equivalent v1 persist-and-skip guard is removed on the same
    grounds.

- operation: (every UUID path parameter)
  change: "A malformed UUID in a path is 422 (v1: 400 or 404, depending which endpoint you hit)"
  reason: >
    A path id that is not a UUID is a contract breach, so it is refused at the
    boundary rather than handled per endpoint. v1 let the raw string through
    and each route decided for itself: the CRM job-link and assign-number
    routes reached the service and returned a business 400 "Phone call not
    found", while the retrieve/update/delete routes converted it and raised
    404. Both told the caller the id was well-formed and merely unmatched,
    which was untrue, and neither could be predicted from the published
    contract - v1's own schema pinned `format: uuid` on all 12 of these
    parameters while accepting anything at runtime.

    v2 types the parameters `UUID`, so ninja rejects a malformed one with a
    422 before any handler runs, identically everywhere. This closed 12 of the
    16 `uuid` contract gaps and deleted both string-to-UUID helpers
    (`_uuid_or_404` in apps/crm/api.py, `_uuid_or_client_error` in
    phone_call_service.py) - two implementations of one concept, disagreeing
    on the status code (ADR 0039, ADR 0045). A well-formed id that matches no
    row still returns the same business 400 or 404 it always did; only the
    malformed case moved. User decision 2026-08-07.

    Watch at cutover: the 422 body is ninja's validation list, not the
    `{"message": ...}` envelope, so a client that reads `.message` on this
    path sees undefined instead of a string. No frontend code does - the
    generated client types these parameters as uuid, so a malformed id cannot
    originate from the SPA.

- operation: accounts_token_create, accounting_reports_staff_performance_summary_retrieve,
    accounting_reports_staff_performance_retrieve, accounting_reports_calendar_retrieve
  change: "Response bodies always carry every declared field; exclude_none removed"
  reason: >
    These four operations set exclude_none=True, so a key vanished from the
    body when its value was null: password_needs_reset on login, job_breakdown
    on the staff-performance summary, holiday_name on non-holiday calendar
    days. The body's KEYS therefore depended on the data, and a client had to
    check presence, then check null, then read the value - three branches for
    one answer, and no way to tell "the server omitted it" from "the server
    does not know".

    They send null instead. Every response schema now declares all its
    properties required, which is what ninja already does at runtime
    (exclude_unset, exclude_defaults and exclude_none all default to false), so
    the published contract stopped understating what the server sends. A gate
    in scripts/checks/export_openapi.py pins optional response properties at
    zero.

    The staff-performance pair is the case worth remembering: summary and
    detail share one schema, and the omission was the only thing distinguishing
    them. Summary rows now return job_breakdown: null. User decision
    2026-08-08.

    Watch at cutover: nothing in the SPA reads these three fields today, so the
    change costs no frontend work. It is done before the screens are ported
    rather than after, because a screen written against the loose contract
    accretes guards that then have to be found and removed.

- operation: company_defaults_schema_retrieve
  change: "Sections with no fields are not served; there is no 'crm' section"
  reason: >
    v1 registered a crm section while the phone-provider settings lived on
    CompanyDefaults, then moved them to PhoneProviderSettings (apps/crm) and
    kept serving the empty section — the settings screen rendered one button
    per section served, so production carried a CRM button that opened an
    empty form. The CRM settings are not lost: they are the phone_provider_*
    columns of IntegrationSettings at /api/integration-settings/ (ADR 0053). A
    section is earned by a field; the first company-wide CRM default re-adds
    the registry line, and the boot check loudly demands it until then.

- operation: company_defaults_schema_retrieve
  change: "DateTimeField columns report type 'datetime', not 'date'"
  reason: >
    v1's UI-type map listed DateField before its subclass DateTimeField, so
    isinstance matched the parent first and every timestamp (last_xero_sync,
    last_xero_deep_sync) was offered a date input. Subclasses now sit before
    their parents, and the live-field tests pin the ordering.

- operation: company_defaults_partial_update / company_defaults_logo_update / company_defaults_logo_destroy
  change: "All three endpoints require superuser (v1: any authenticated user could write; v1's only gate was a frontend route guard)"
  reason: >
    Company-wide defaults (pricing, markups, wage rates, Xero linkage) were
    writable by any staff cookie in v1 — the settings screen's route guard was
    the only thing standing between a workshop login and the numbers every
    quote and invoice prices from. v2 gates the write surface itself.

- operation: company_defaults_update
  change: "Endpoint not ported"
  reason: >
    v1's PUT (full-replace) sibling of the PATCH endpoint. apps/core/api.py
    exposes only company_defaults_partial_update; the settings screen's only
    write path was always the PATCH. Dead surface.

- operation: company_defaults_logo_update / company_defaults_logo_destroy
  change: "Logo upload moved from body-field POST /api/company-defaults/upload-logo/ to path-param POST/DELETE /api/company-defaults/logo/{field_name}/"
  reason: >
    v1's raw fetch() posted field_name inside the multipart body to one
    shared endpoint; v2 names the field in the path and generates a typed
    multipart client for it. No external party holds the old URL.

- operation: company_defaults_partial_update
  change: "Blank string on a nullable text field is 422 at the schema (ADR 0040) rather than v1's serializer 400"
  reason: >
    Same NullableText contract already applied elsewhere (PO lines, stock,
    product mappings, pickup addresses): "" is rejected before the database;
    null clears the field.

- operation: company_defaults_logo_update
  change: "Uploads are content-validated; a mislabeled non-image file is a 400 (v1 stored it), and .svg is no longer an accepted logo format (v1 accepted it)"
  reason: >
    The logo is opened as a raster image when the PO PDF and workshop PDF
    services render it (PIL; grep Image.open over apps/ finds both), so an
    SVG or a mislabeled non-image file stored by v1 only failed later, at PDF
    generation, with no diagnosis path back to the upload that caused it.
    v2 validates content at upload time and does not accept SVG.

- operation: xero_ping_retrieve
  change: "GET performs a token refresh (a DB write) when the token nears expiry — kept from v1, recorded as the argued exception to the GET-never-writes rule"
  reason: >
    Ping's whole contract is "is the connection USABLE" — the E2E preflight
    and the header badge act on it. A read-only ping would report a token
    that refresh would actually reject (Xero rotates refresh tokens, and a
    consumed rotation is only discoverable by refreshing), so connected:true
    would be a lie precisely when it matters. The write is token maintenance
    on the XeroApp row, never domain data. Revisit if a POST /xero/refresh/
    is ever added: ping could then report staleness instead of resolving it.

- operation: xero_oauth_callback
  change: "OAuth state parameter is validated against the session (v1 stored it and never compared); mismatch redirects with xero_error"
  reason: >
    v1 threaded state/session_state into exchange_code_for_token, which only
    logged them — the CSRF check the state exists for was missing, so any
    party could complete the flow and rebind the install's Xero connection.
    /api/xero/authenticate/ additionally requires an office-staff cookie JWT
    (v1: anonymous). Do not "fix" the check away for parity.

- operation: companies_create_create
  change: "Duplicate-contact 409 body is the standard error envelope (v1: structured existing_company payload parsed back out of the error string)"
  reason: >
    v1's CreateCompanyModal offered a "use existing company" flow off that
    payload; the v2 modal subset does not, and no spec asserts the body
    shape. Status codes keep v1's mapping (409 duplicate / 401 provider
    unauthenticated / 400 validation). Restore a typed payload if the
    use-existing UX ports.

- operation: (xero sync - company fields)
  change: "A company with empty raw_json fails its sync instead of being renamed 'Unnamed Company'"
  reason: >
    v1's set_company_fields carried a self-confessed "BUG BUG BUG REMOVE"
    fallback that invented a name and timestamps when raw_json was absent.
    ADR 0015: a company reaching the field-derivation path without its payload
    is a sync defect to surface, not paper over. The v2 port raises.

- operation: (ADR 0007 payroll resync question - ANSWERED)
  change: "Pay-slip sync never touches timesheet CostLines; the resync-deletes-lines question is a payroll-PUSH concern, not a sync concern"
  reason: >
    Read at port time (v1 transforms.transform_pay_slip): the sync path only
    mirrors XeroPaySlip rows (gross/tax/net, timesheet_hours, leave_hours from
    earnings lines) keyed by xero_id. It neither reads nor writes timesheet
    CostLines, so a resync that turns a work week into all-leave/unpaid
    updates the mirror and nothing else. Whatever deletes stale timesheet
    lines lives in the payroll PUSH flow (post_time_entries side), which is a
    recorded Phase 4 deferral — answer the deletion behaviour there when it
    ports.

- operation: (xero sync - unarchive restores allow_jobs)
  change: "Neither the batch sync nor the webhook path pre-writes xero_archived before set_company_fields, so the ADR 0034 unarchive->allow_jobs restore now fires (in v1 it was dead code on BOTH paths)"
  reason: >
    v1 wrote xero_archived from the contact before calling
    set_company_fields on the hourly batch path AND the webhook path, so the
    was_archived transition check always compared the already-updated value
    — un-archiving a contact in Xero never restored allow_jobs anywhere.
    set_company_fields now solely owns archive-state derivation (one
    implementation per concept), making the restore work on every path.

- operation: (xero sync - phone-conflict AppError survives the rollback)
  change: "The cross-company phone-conflict AppError is persisted after set_company_fields' transaction rolls back (v1 persisted inside the atomic block, so the row vanished with the rollback)"
  reason: >
    The company write and its phone sync are one atomic unit by design; the
    error row recording WHY the unit failed must not be part of it. v1 wrote
    the AppError inside the block and lost it to the rollback, leaving only
    the page-level handler's less specific record.

- operation: xero_delete_purchase_order
  change: "Successful PO delete returns 200 {success, xero_id, message}; v1 returned 500 on every successful delete"
  reason: >
    v1's delete_document returned {"success": true, "action": "delete"} and
    the view fed that into XeroDocumentSuccessResponseSerializer, whose
    required xero_id made is_valid(raise_exception=True) blow up — every
    successful v1 PO delete was reported to the client as a 500 after the
    delete had already happened in Xero. v2 returns the document response
    shape the serializer always expected.

- operation: xero_create_invoice / xero_delete_invoice
  change: "fully_invoiced recalculates in the same request that pushes or deletes an invoice; v1 left the flag to the hourly sync"
  reason: >
    v1 managers only bumped job.updated_at and relied on the next sync's
    invoice transform to flip fully_invoiced — under XERO_READONLY no sync
    ever sees the fabricated invoice, and even live, the response the Finish
    tab refetches would show a stale flag for up to an hour. v2 calls
    recalculate_job_invoicing_state (the same shared implementation the sync
    uses) before returning, so the flag is correct in the response that
    reports the invoice.

- operation: job_jobs_quote_retrieve
  change: "Plain 200 with a {quote: QuoteOut | null} envelope; v1 served a bare nullable body as a conditional GET on the job ETag"
  reason: >
    Nothing external holds this URL, and both v1 behaviours are traps for an
    axios/TanStack consumer: a 304-with-empty-body reads as "no quote", and
    the generated client coerces a bare JSON null body to {}, which reads as
    a quote existing. The envelope is the only shape that round-trips
    absence; the tab refetches after every mutation, so the conditional GET
    bought nothing.

- operation: job_jobs_cost_sets_cost_lines_create
  change: "UI-created estimate/quote time lines store NULL xero_pay_item; v1's grid sent the job's default pay item"
  reason: >
    The field is load-bearing only for ACTUAL time lines (CostLine.clean
    requires it there; payroll and the rate pipeline read actual/timesheet
    lines only), and NULL is the honest value for time that has not reached
    payroll. Job creation's seeded estimate lines still carry the default
    pay item, so estimate data is mixed — recorded so nobody "fixes" either
    side without deciding for both.

- operation: job_cost_lines_partial_update / jobCostLinesDeleteDestroy
  change: "Quantity edits and deletes move Stock ONLY for actual cost-set lines; v1 adjusted inventory from estimate and quote lines too"
  reason: >
    Only actual lines consume inventory — an estimate or quote references a
    stock item hypothetically. v1's update view diff-adjusted the Stock row
    on every quantity change and its delete view returned the quantity,
    regardless of cost-set kind, so editing an estimate quantity from 1 to
    10 silently drew 9 units off real inventory that no consumption ever
    took (and deleting the line conjured stock back). v2 guards both
    movements on cost_set.kind == "actual". Found by the cost-entry E2E
    spec's estimate scenario, which exercises exactly that edit.

- operation: (xero operator commands — production guards)
  change: "Production/tenant/readonly refusals run before EVERY phase of xero, seed_xero_from_database and start_xero_sync (v1: one DB-name check inside the clear phase that printed ERROR and continued, bypassed entirely by the flag that skipped that phase; no tenant-id check; no XERO_READONLY check)"
  reason: >
    apps/xero/operator_guards.py refuses a DB_NAME ending _prod, a connected
    tenant in PRODUCTION_XERO_TENANT_IDS, and XERO_READONLY=true, and
    aborts with a non-zero exit instead of print-and-continue. These commands
    rewrite Xero linkage on live data; a bypassable warn was the hole through
    which a seed could push demo ids at the production organisation. User
    ruling 2026-08-15: keep, never revert for parity.

- operation: start_xero_sync
  change: "Inline runs hold the shared sync lock; --force without --entity is refused; a disabled enable_xero_sync gate and a failed sync exit non-zero (v1: no lock, silent no-op --force, exit 0 on failure)"
  reason: >
    v1's inline sync could interleave with a beat-dispatched Celery sync (no
    lock), accepted --force without --entity and reported success having
    synced nothing, and wrote errors to stderr while exiting 0 — so the
    restore runbook's check loop could not gate on it. The gate is enforced
    once, inside the sync engine, which raises XeroSyncDisabled; the command
    reports that refusal. It does NOT infer the gate from an empty event
    stream — an enabled sync with no work to do exits 0. The disposition drops
    v1's validate_restore_progress.py precisely because v2 commands exit
    non-zero. User ruling 2026-08-15: keep.

- operation: seed_xero_from_database
  change: "Clear phase purges XeroSyncCursor rows; an uncoded Sales account, a numberless document, or an unmappable Xero batch response abort with a repair recipe (v1: stale prod cursors survived, uncoded ledger passed through, '! Could not map' warned and continued)"
  reason: >
    Stale production high-water marks made the first demo-org sync skip
    older records; warn-and-continue left half-linked batches an operator
    discovered only from duplicate documents later. The raise names the
    remedy (fix the named row, then re-run, optionally --only <phase>). User
    ruling 2026-08-15: keep. xero --setup likewise errors on a missing
    organisation shortcode instead of v1's silent None (broken deep links).

- operation: seed_xero_from_database
  change: "Whether the clear runs, whether pay items are re-linked and whether the sync gate re-opens are all measured from the database; a converged --only run opens the gate"
  reason: >
    v1 (and the first v2 port) tracked batch completion in operator flags —
    a clear-skipping switch and a 'partial' boolean derived from --only — so
    the gate recorded which options were typed rather than whether the mirror
    was fully linked, and re-running a subset could never finish the batch.
    v2 derives all three: a link carrying a tenant other than the connected
    one means clear, a referenced pay item not linked to this organisation
    means re-link, and zero remaining work across contacts, employees,
    invoices, quotes, stock and pay items means open the gate. Every count is
    produced by the same predicate its phase works from. User ruling
    2026-08-15: the flag design was a bug; state comes from the data model.
    Staff joined that measurement when the employees phase landed: without it
    the seed converged and opened the gate over a mirror whose every staff
    link was a production id the connected organisation had never held.

- operation: (timesheet — Xero leave-name resolution)
  change: "An unknown Xero leave display name raises naming the name (v1 silently mapped it to 'Sick Leave')"
  reason: >
    v1's fallback misclassified any renamed or new leave type as sick leave
    in payroll data — silent corruption with a payroll consequence. The
    error names the unknown name, so the fix is a rename or mapping
    addition. User ruling 2026-08-15: keep the raise.

- operation: create_service_api_key
  change: "A name collision is refused with CommandError (v1 reprinted the existing shown-once key and exited 0)"
  reason: >
    Re-printing a shown-once credential on a name collision re-exposes it in
    terminal scrollback and reads as success to a wrapper. Refusal forces a
    deliberate choice (new name, or rotate by deleting the old row). User
    ruling 2026-08-15: keep.

- operation: (diagnostics — v1's dev-demo export scrubber)
  change: "v1's export_dev_demo_dump and its scrubber are not ported; a demo export of an already-scrubbed dev database is a plain pg_dump"
  reason: >
    The production-host scrub is the one and only confidential-to-
    non-confidential transition (ADR 0039 exclusivity rule, user ruling 2026-08-15). A dev
    database restored from a scrubbed dump is non-confidential by
    construction, so a second dev-side scrubber re-implements the one
    transition — the DRY violation, and a standing signal of distrust in the
    scrubber whose fix belongs at the scrubber.
    (The Quote contact-block scrub is the same family, sanctioned in review
    commit 971e803.)

- operation: (restore tooling — scripts/ops)
  change: "Restore checks exit non-zero on failure (check_jobfiles counts, sync failures) and fix_test_company refuses an unset CompanyDefaults.test_company_name (v1: informational exit 0, and proceeded against a None name)"
  reason: >
    The restore-prod-to-nonprod runbook's check loop gates on exit codes;
    informational-only checks taught operators to read past red. The
    test_company_name refusal points at the field the seed matches on
    instead of creating an unmatchable company. User ruling 2026-08-15:
    keep.

- operation: timesheets_weekly_retrieve / getDailyTimesheetSummaryByDate
  change: "The weekly and daily overviews share one day-status vocabulary: Complete, Partial, No Entry, Leave, Off, Unscheduled. The weekly payload no longer carries the glyphs '✓' and '⚠'; the daily payload no longer carries 'Weekend' and 'Weekend Work'"
  reason: >
    v1 answered the same question — how did this staff member's day go — in
    two vocabularies, so a weekly cell and the daily row for the same person
    and day could not be compared. One implementation now serves both
    (apps/timesheet/services/hour_categories.py, ADR 0039), which is what
    makes a weekly cell mean the daily status of that day. Glyphs on the wire
    were also presentation in the payload and unreadable in a status column.
    Two daily values were renamed rather than dropped: 'Weekend' is 'Off'
    (nothing rostered, nothing booked) and 'Weekend Work' is 'Unscheduled'.
    'Unscheduled' is now reported whenever hours land on an unrostered day
    rather than only when weekend timesheets are enabled — v1 hid Saturday
    hours behind a plain 'Weekend' whenever the flag was off.

- operation: getDailyTimesheetSummaryByDate
  change: "A day booked entirely to leave reports day_status 'Leave' (was 'Complete'), which moves summary_stats.complete_staff and completion_rate"
  reason: >
    v1's daily service never looked for leave: it saw eight hours and called
    the day Complete, while the weekly screen called the same day Leave.
    Counting someone on approved annual leave towards the day's completion
    rate overstates it. The weekly banding (Complete/Partial/Minimal/Missing
    over a week's hours) is unchanged and now travels as week_status, so the
    day concept and the week concept no longer share a field name.

- operation: timesheets_weekly_retrieve
  change: "Leave is identified by the line's own xero_pay_item.uses_leave_api — a public holiday, which names no pay item, by its LeaveType job FK — not by 'Leave' appearing in the job name; leave columns are keyed on the fixed category code (hour_categories.COLUMN_BY_CODE)"
  reason: >
    v1 split work from leave on a job-name substring and then bucketed by the
    JOB's default pay item, so a renamed job silently reclassified paid leave
    and a line whose own pay item disagreed with its job was misfiled. The
    pay item is what payroll actually posts against (ADR 0007), and it is the
    only unambiguous source: 'Holiday Pay' exists in Xero both as an earnings
    rate and as a leave type, so the name alone cannot answer the question.

- operation: timesheets_weekly_retrieve
  change: "Adds other_leave_hours / total_other_leave_hours"
  reason: >
    v1 reported sick, annual and bereavement and silently dropped every other
    leave type — parental, domestic violence, alternative holidays, unpaid
    leave. Those hours still counted in the day total, so the leave columns
    did not sum to it and payroll reconciliation carried an unexplained gap.

- operation: getDailyTimesheetSummaryByDate
  change: "Only actual cost-set time lines are counted (v1 counted time lines from any cost set)"
  reason: >
    An estimate or quote time line describes hypothetical hours, not worked
    ones. The weekly overview always filtered this way; the daily one did not,
    so the two could disagree. No row in the database is affected — no
    non-actual time line carries both a staff member and an accounting date —
    but the filter is what stops one appearing.

- operation: (timesheet reads — meta defaults)
  change: "meta.is_billable and meta.wage_rate_multiplier are read directly; a line missing either is refused instead of defaulting to billable ordinary time"
  reason: >
    Both are denormalised onto the line at write time and every actual time
    line in the database carries them, so the v1 `meta.get(key, default)`
    reads were dead fallbacks that could only ever mask bad data (ADR 0015,
    ADR 0028). A missing key now names the line instead of quietly moving
    hours between payroll buckets.

- operation: timesheets_payroll_post_staff_week_create
  change: "The POST dispatches a Celery task that does the posting; the SSE stream only replays the progress that task publishes. v1 performed every Xero write inside the stream's GET handler"
  reason: >
    v1's shape made fetching a URL write payroll, which the repo's first
    coding standard forbids outright, and it made the client's connection the
    thing doing the work — so a disconnect mid-batch destroyed the only record
    of which staff had succeeded, leaving re-posting everyone as the sole
    recovery. The task rewrites ONE run document in place and every push
    carries the whole of it, so a client that connects late, reconnects or
    reloads needs the present rather than a replayed history (ADR 0047). The
    POST answers that opening document ({run: ...}); the same document is
    served by GET /timesheets/payroll/runs/ and pushed on the payroll SSE
    channel.

- operation: (payroll posting — leave and work routing)
  change: "Lines are routed to Xero's two payroll APIs by the line's own xero_pay_item; v1 pattern-matched the job name via Job.get_leave_type()"
  reason: >
    Renaming a leave job silently reclassified paid leave in v1, and the job's
    default pay item could disagree with what the line actually carried. The
    name is also ambiguous — "Holiday Pay" is both an earnings rate and a
    leave type in Xero — so only the line's own pay item can answer it. v1
    expressed this chain three different ways (job-name substring in the
    weekly service, LEAVE_JOB_NAMES in xero_hours, multiplier__gt=1
    elsewhere); v2 has one.

- operation: (payroll posting — staff window)
  change: "A staff member outside the posted week is reported as skipped with has_entries, rather than silently omitted"
  reason: >
    Someone who joined after the week or left before it must not be posted,
    but hours booked against them still need to be visible — otherwise the
    operator sees a total that does not match what reached Xero and has no
    way to find out why.

- operation: (payroll posting — per-staff failures)
  change: "One staff member's failure is reported against that staff member and the batch continues; only preflight failures abort the run"
  reason: >
    An employee not yet linked to Xero should not strand everyone else's
    hours. Preflight failures (unlinked pay items, a blocking draft pay run)
    still refuse the whole week before anything is posted, because those are
    conditions no individual post can succeed under.

- operation: timesheets_payroll_pay_runs_retrieve
  change: "next_postable_week_* now falls back to the payroll calendar's anchor period when the calendar holds no pay runs (previously null with a logged warning)"
  reason: >
    Supersedes the earlier entry recording that gap. The calendar fetch is now
    reachable through the accounting provider registry, so v1's third case is
    implemented. It stays a read that degrades rather than fails: if the
    provider is unreachable the field is still null. Null means the server
    could not name the week — the client renders no banner and invents
    nothing; the POST enforces the postable-week rule itself on a mirror it
    refreshes, so a wrong week costs a refusal naming the right one.

- operation: accounting_reports_payroll_reconciliation_retrieve
  change: "The payroll reports (reconciliation, its /week/ sibling, and the date-range helper) now require superuser, where v1 served every report to any authenticated staff member"
  reason: >
    Per-employee gross pay is superuser data on every other surface of this
    application - the /api/timesheets/ management endpoints, the leave admin
    and the payroll SSE channel are all gated for exactly that reason - so
    serving the same names-and-pay document to any workshop cookie on the
    accounting router was a hole, not a contract. The only page that links to
    these reports is itself superuser-only.

- operation: timesheets_payroll_post_staff_week_create
  change: "The request names only the week: the server derives the roster from the same filter the weekly grid uses, and enforces Xero's post-in-order rule on a mirror it refreshes inside the POST; v1 (and the first cut here) took staff_ids from the client and gated postability client-side"
  reason: >
    The client's staff list was the grid's payload relayed back at the server,
    so a grid loaded before a staff change posted a stale roster; and the
    postable-week gate read a mirror refreshed hourly, so a stale banner could
    lock the truly-postable week behind a disabled button with no recovery.
    Deriving both server-side, on data refreshed inside the POST, makes the
    worst case a clear 400 naming the postable week. The pay-run create and
    mirror-refresh operations are dropped with this (see
    scripts/v1-frontend-operations.yml): creating the run is a step of posting
    (leave reconciles before the draft exists, KAN-326), and mirror hygiene is
    not an operator job.
