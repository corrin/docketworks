# Parity ledger (see plan: every intentional v1→v2 API deviation is recorded
# here; the schema-parity diff fails CI on any deviation NOT listed).

- operation: accounts_token_create
  change: "Wrong password returns 401 (was 400)"
  reason: >
    v1's CustomTokenObtainPairSerializer raised DRF ValidationError (400)
    while its own OpenAPI schema documented 401. v2 implements the documented
    contract. Response body is ninja's {"detail": "Unauthorized"}.

- operation: accounts_token_create
  change: "password_reset_url omitted from login response (was optional)"
  reason: >
    v1 built it via reverse("accounts:password_change"); endpoint not yet
    ported. password_needs_reset boolean still returned. Restore when the
    password-change endpoint ports.

- operation: accounts_token_verify_create
  change: "Endpoint not ported"
  reason: >
    Present in v1's schema but referenced only by the generated client —
    zero app-code call sites in v1's frontend. Dead surface.

- operation: (auth-wide)
  change: "ENABLE_JWT_AUTH toggle dropped; cookie auth always on"
  reason: >
    v1 ran with it enabled everywhere except .env.precommit. Tokens never
    appear in response bodies in v2.

- operation: (error-envelope-wide)
  change: "Request-validation errors return ninja's 422 list (v1/DRF: 400 field-dict)"
  reason: >
    Framework-native shape; no external party holds these responses and the
    new frontend consumes the generated client. Adversarial review 2026-08-01
    caught this claimed-but-unrecorded deviation.

- operation: (error-envelope-wide)
  change: "error_id present in every error envelope; 500 bodies carry the verbatim message"
  reason: >
    ADR 0038 (transparent errors, trusted environment): rapid debugging
    outranks disclosure hygiene in a single-tenant locally-installed app.
    v1's opaque Django-default 500s are deliberately NOT reproduced.

- operation: (middleware)
  change: "v1's AccessLogging/DisallowedHost/FrontendRedirect/PasswordStrength middlewares deferred"
  reason: >
    Phase deferrals, now recorded: AccessLogging + DisallowedHost are ops
    concerns (Phase 5), FrontendRedirect needs the deployed SPA (Phase 5),
    PasswordStrength belongs to the accounts password flows (Phase 3).
    Consequence until then: JWT-only users on non-API paths hit the SPA login
    redirect (no non-API surface exists yet).

- operation: (auth 401s)
  change: "401 rejection details restored: 'User is inactive.', token-error strings (v1 parity)"
  reason: >
    ADR 0038. CookieJWTAuth raises AuthenticationError with the specific
    reason for invalid tokens and departed staff; missing cookie still falls
    through as generic no-credentials.

- operation: (frontend transport)
  change: "Outbound trimming skips secret-bearing keys (v1 trimmed passwords too)"
  reason: >
    Trimming a password whose stored hash includes edge whitespace makes it
    silently unusable via the SPA ("wrong password", no diagnosis path). The
    SPA is the only consumer of the auth endpoints, so no external contract
    moves. Ultra review 2026-08-02.

- operation: (frontend concurrency)
  change: "412/428 on delivery-receipt POSTs now handled (v1: raw axios error, no toast/reload)"
  reason: >
    v1 extracted resource ids from URLs only, so body-referenced POs fell
    through its own concurrency UX. v2's idForMutation reads the body -
    keeping the fix; a silent raw error is strictly worse.

- operation: companies_update_update / companies_update_partial_update
  change: "Explicit blank name is rejected with 400 (v1 silently blanked the company)"
  reason: >
    v1's guard (`not data.get("name") and not company.name`) was dead code —
    company.name is never blank on an existing row — so an explicit
    {"name": ""} silently blanked the company. Inherited bug fixed: v2
    rejects it with "Company name is required"; omitted/None name still
    leaves the field untouched. Ultra review 2026-08-02.

- operation: (company merge)
  change: "Source primaries deleted as destination duplicates now promote the destination counterpart"
  reason: >
    v1 deleted the source's duplicate contact methods before its lazy
    source queryset evaluated which primaries were moving, so a source
    primary that duplicated a destination row vanished and its primary flag
    was silently lost. v2 captures the moving primaries first and promotes
    the destination's matching row. Ultra review 2026-08-02.

- operation: (model-layer)
  change: "JobEvent description builders fail fast on corrupt payloads v1 rendered"
  reason: >
    Three edges (non-str legacy_description, non-str manual note_text, float
    priority positions) rendered under v1 and now raise/sentinel under v2.
    Only reachable with malformed stored event payloads; ADR 0015 posture is
    consumers stay strict and data gets fixed. Adversarial review 2026-08-01.

- operation: (model-layer, review item)
  change: "PurchaseOrder.reconcile() ported verbatim INCLUDING its v1 bug"
  reason: >
    The method iterates line.received_lines, a related_name no model defines
    (v1 or v2) - it raises AttributeError for any PO with lines and has zero
    callers. Preserved for parity; the code review should decide: delete the
    dead method or port whatever receipt-line model was intended.

- operation: crm_phone_calls_list
  change: "Loose v1 query values (page=last, has_recording=yes) now 422"
  reason: >
    v1's DRF pagination accepted page=last and truthy-string booleans; v2's
    typed filters reject them. The generated client sends ints/bools, so no
    real caller is affected. Adversarial review 2026-08-02.

- operation: job_jobs_update / job_jobs_partial_update
  change: "Unknown or read-only keys in the delta envelope's `after` now 400 (v1 silently ignored)"
  reason: >
    v1's JobSerializer(partial=True) dropped keys it did not recognise, so a
    client typo (or an attempt to write a read-only field) was a silent
    no-op that still recorded a delta event. v2's explicit dispatch table
    rejects unsupported fields with "Unsupported field '<name>' in delta
    payload" — a 400 the client can see. Adversarial review 2026-08-02.

- operation: job_jobs_update / job_jobs_partial_update
  change: "Invalid job_status values rejected with 400 (v1 accepted anything into the DB)"
  reason: >
    v1's serializer routed job_status through a plain CharField source, so a
    value outside JOB_STATUS_CHOICES was written verbatim to the status
    column (choices are not DB-enforced). v2 validates against the choice
    set (likewise pricing_methodology, speed_quality_tradeoff, rdti_type).
    Adversarial review 2026-08-02.

- operation: job_jobs_update / job_jobs_partial_update
  change: "Hard-fail delta rejection rows persist detail {server_checksum, current_values} (v1 stored detail=None)"
  reason: >
    v1's service-level DeltaValidationError recording passed no detail, so
    the forensics row said only "checksum mismatch" with nothing to compare
    against. v2 stores the server-side checksum and the current field values
    the client lost to, making "my edit didn't save" diagnosable from the
    rejection row alone. Adversarial review 2026-08-02.

- operation: job_jobs_costs_summary_retrieve
  change: "costs/summary profitMargin now margin-on-revenue: (rev-cost)/rev*100 (v1 reported markup-on-cost there)"
  reason: >
    v1 carried two formulas under the same field name: CostSetSerializer
    computed (rev-cost)/rev*100 while JobCostSummaryRestView computed
    (rev-cost)/cost*100 — user standardised on margin-on-revenue 2026-08-02
    (zero denominator -> 0.0). Cost-set reads are unchanged; the two
    endpoints now agree.

- operation: job_cost_lines_partial_update
  change: "Explicit JSON null for optional scalar PATCH values is ignored (v1/DRF rejected null with 400)"
  reason: >
    v2's partial-update collector applies only provided non-null scalar
    fields, so {"quantity": null} is a no-op where v1's DRF serializer
    answered a 400 field error. FK fields (xero_pay_item, staff,
    labour_subtype) still accept explicit null to clear. Adversarial review
    2026-08-02.

- operation: job_jobs_cost_sets_quote_revise_create
  change: "revisions[].archived_at is timezone-aware UTC ISO-8601 (v1: naive local datetime.now())"
  reason: >
    v1 archived datetime.now().isoformat() with no tzinfo, making revision
    timestamps ambiguous across DST/timezone changes; v2 records
    timezone.now(). Adversarial review 2026-08-02.

- operation: job_jobs_cost_sets_cost_lines_create / job_cost_lines_partial_update
  change: "Blank desc ('') on cost-line writes returns 400 (v1: 500 via its own desc_not_blank DB constraint)"
  reason: >
    v1's serializer let blank desc through to the database, where the
    desc_not_blank check constraint raised IntegrityError (500, verified
    against v1's live schema). v2's CostLine.save() runs full_clean with
    constraint validation, surfacing the same rule as a 400. Adversarial
    review 2026-08-02.
