[project]
name = "docketworks"
version = "2.0.0-dev"
description = "Docketworks v2 — job/docket management for jobbing shops"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=6.0,<6.1",
    "django-ninja>=1.4",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.1",
    "pydantic>=2.13",
    "celery>=5.5",
    "django-celery-results>=2.5",
    "redis>=5.0",
    "django-ninja-jwt>=5.4.5",
    "django-solo>=2.5.1",
    "django-simple-history>=3.13.0",
    "pillow>=12.3.0",
    "jsonschema>=4.26.0",
    "requests>=2.34.2",
    "rapidfuzz>=3.14.5",
    "nicknames>=1.0.1",
    "reportlab>=5.0.0",
    "pypdf>=6.4.0",
    "beautifulsoup4>=4.13.4",
    "pdf2image>=1.17.0",
    "litellm>=1.95.0",
    "selenium>=4.46.0",
    "holidays>=0.102",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=1.16",
    "django-stubs[compatible-mypy]>=6.0",
    "pytest>=9.0",
    "pytest-django>=4.11",
    "pytest-cov>=6.0",
    # Imported directly by scripts/checks/status_table.py to read the coverage
    # total out of the .coverage data file, rather than arriving only through
    # pytest-cov. Declared because it is used, per ADR 0033.
    "coverage>=7.15",
    "pytest-xdist>=3.6",
    "pre-commit>=4.5",
    "import-linter>=2.0",
    "celery-types>=0.23",
    "deptry>=0.25",
    "types-jsonschema>=4.26.0.20260518",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260724",
    "types-requests>=2.33.0.20260712",
    "freezegun>=1.5.5",
    "types-reportlab>=4.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "DJ",        # flake8-django
    "UP",        # pyupgrade
    "C4",        # comprehensions
    "C90",       # mccabe complexity
    "SIM",       # simplify
    "N",         # pep8-naming
    "S",         # bandit security
    "D",         # pydocstyle — public API is documented
    "DTZ",       # naive-datetime bans
    "T20",       # no print()
    "LOG", "G",  # logging hygiene: no f-strings/concat in log calls
    "PIE",       # misc best-practice
    "RET",       # return-statement hygiene
    "ARG",       # unused arguments
    "PTH",       # pathlib over os.path
    "ERA",       # no commented-out code
    "ISC",       # implicit string concat traps
    "RSE",       # raise statement hygiene
    "BLE",       # blind `except Exception`. Not sufficient on its own, which is
                 # why config/tests/test_exception_handler_contract.py exists
                 # too: BLE001 sees how WIDE a catch is, never what the handler
                 # then does with it. `except ValueError: pass` is narrow and
                 # silent — BLE001 passes it, the contract test does not.
    "PL",        # pylint (subset)
    "TRY",       # exception-handling anti-patterns
    "RUF",
]
ignore = [
    "D203",     # (conflicts with D211 — pep257 convention)
    "D212",     # multi-line docstring starts on second line (house style)
    "D105",     # magic methods don't need docstrings
    "D106",     # nested Meta classes don't need docstrings
    "PLR2004",  # magic-value comparisons — too noisy for HTTP statuses etc.
    "TRY003",   # long exception messages inline — house style allows
    "TRY400",   # logger.error in handlers is deliberate (persist-then-raise pattern)
    "TRY301",   # inline guard-clause raises are the house style (check bad case first)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Generated by makemigrations — machine-written, not held to hand-written style.
# Data migrations also carry RunPython's fixed (apps, schema_editor) signature
# (ARG001) and v1-ported explanatory comments (ERA001).
"apps/*/migrations/*" = ["E501", "RUF012", "D", "ARG001", "ERA001"]
# Tests: asserts are the point; fixtures use hardcoded creds; docstrings optional.
"apps/*/tests/*" = ["S101", "S105", "S106", "D"]
"config/tests/*" = ["S101", "S105", "S106", "D"]
"conftest.py" = ["D"]
# Operational scripts talk to humans via print, don't need full docstring
# coverage, and must configure Django before importing app modules (PLC0415).
"scripts/*" = ["T20", "D", "PLC0415"]
# Settings modules: module-level env reads and star-import test override are the pattern.
"config/settings*.py" = ["D100"]
# Stubs mirror third-party signatures; documentation lives upstream.
"stubs/*" = ["D", "PL"]
# django-ninja injects `request` into every endpoint signature whether used or not.
"apps/*/api.py" = ["ARG001"]

[tool.deptry]
known_first_party = ["apps", "config"]

[tool.deptry.per_rule_ignores]
# Loaded via config strings, not imports: psycopg (DATABASES ENGINE),
# django-celery-results + redis (Celery result backend/broker), pillow
# (ImageField), pydantic (django-ninja Schema base until schemas import it directly).
DEP002 = ["psycopg", "django-celery-results", "redis", "pillow", "pydantic"]
# Test modules importing dev-group tools is correct; scripts/ are dev/CI
# tooling, so pyyaml (the schema exporter) and coverage (the status table,
# reading the total out of the .coverage file CI already wrote) stay in the
# dev group. Neither ships in the application.
DEP004 = ["pytest", "pytest_django", "yaml", "freezegun", "coverage"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "stubs"
# scripts/ is in scope because the gates live there. It was outside until a
# probe found a real defect in one: a tuple-keyed dict tested against a set of
# strings, always false, silently ignoring the parity ledger. Code that decides
# whether other code may merge should be checked at least as hard as the rest.
files = ["config", "apps", "manage.py", "scripts"]

[tool.django-stubs]
django_settings_module = "config.settings_test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["apps", "config"]
# Coverage is NOT here on purpose. It costs ~23% on every run and enforces a
# `fail_under` gate that only has to hold once, so CI passes the flags
# explicitly (see .github/workflows/ci.yml) and the dev loop stays fast. v1
# ran `-q -m 'not broker'` for the same reason; putting --cov in addopts was a
# v2 regression in feedback speed, not an inherited setting.
#
# `-n auto` is here rather than left to the caller because the serial run is
# ~3x slower and a dev loop that runs the suite ~20 times a PR pays that
# difference every time. `--dist loadscope` groups tests by module so a class's
# DB fixtures build once per worker instead of once per test. xdist gives each
# worker its own database (gw0, gw1, …), so this is safe; what is NOT safe is
# two SEPARATE pytest sessions at once, which still need distinct DB_NAMEs.
addopts = "-q -n auto --dist loadscope"

[tool.coverage.run]
omit = ["apps/*/migrations/*", "apps/*/tests/*", "config/tests/*"]

[tool.coverage.report]
# Ratchet: raise as phases land, never lower. History: 80 at Phase 1; re-based
# to 69 at Phase 2 (model layer ahead of its tests); 80 at Phase 3a; 85 at
# Phase 3b-1 (job core); 88 at Phase 3c-3 (quoting, actual 89.8).
# Keep raising per slice.
fail_under = 88

[tool.importlinter]
root_packages = ["apps", "config"]

[[tool.importlinter.contracts]]
name = "Layering: core imports no domain app; domain apps do not import integrations; config on top"
type = "layers"
# Domain apps are colon-separated (non-independent): they may import each other,
# matching v1's architecture (job->company, purchasing->job, ...). Integrations
# sit above domains; the one inherited inversion is ignore_imports'd below.
#
# apps.ai sits in the BOTTOM layer beside apps.core, not with the integrations:
# it is infrastructure (a provider-config model plus the one LiteLLM proxy), it
# depends on no domain app, and AI is used across the app — extraction, chat,
# supplier enrichment, quote-to-PO. Putting it above the domains would force
# every consumer through a registry seam and invite per-domain LLM clients,
# which is exactly how v1 ended up with four (ADR 0041).
layers = [
    "config",
    "(apps.xero) | (apps.search) | (apps.diagnostics)",
    "(apps.job) : (apps.accounts) : (apps.company) : (apps.crm) : (apps.purchasing) : (apps.quoting) : (apps.accounting) : (apps.timesheet) : (apps.operations) : (apps.process)",
    "(apps.core) : (apps.ai)",
]
exhaustive = false
exclude_type_checking_imports = true
ignore_imports = [
    # Inherited v1 inversion: Job.save() resolves the default XeroPayItem
    # directly. Phase 4 (Xero port) inverts this through the provider registry;
    # do not add further entries here.
    "apps.job.models.job -> apps.xero.models",
]
